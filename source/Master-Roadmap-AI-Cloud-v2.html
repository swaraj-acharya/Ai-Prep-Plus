<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Roadmap — AI Cloud Engineering Learning OS</title>
<style>
:root{
  --bg:#F4F5F1;--surface:#FFFFFF;--surface2:#ECEEE8;--ink:#141F2B;--muted:#5F6C79;--line:#DCE0D8;--line2:#EAECE5;
  --accent:#1E4FA3;--accent-ink:#FFFFFF;--accent-soft:#E7EEFA;--amber:#B26F12;--amber-soft:#FBF0DC;--red:#B4392A;--red-soft:#F8E3DF;--green:#237A57;--green-soft:#DFF1E7;
  --shadow:0 1px 0 rgba(20,31,43,.04),0 6px 20px -12px rgba(20,31,43,.18);
}
[data-theme="dark"]{
  --bg:#0D1826;--surface:#142235;--surface2:#1B2D44;--ink:#E9EEF4;--muted:#93A4B6;--line:#26394F;--line2:#1F3147;
  --accent:#F0B54A;--accent-ink:#11202F;--accent-soft:#25384E;--amber:#F0B54A;--amber-soft:#3A3120;--red:#F27A70;--red-soft:#432529;--green:#63D3A3;--green-soft:#1B3A31;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .35em;line-height:1.15;letter-spacing:-.02em}
h1{font-size:2rem;font-weight:800}h2{font-size:1.4rem;font-weight:750;margin-top:1.6em}h3{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}h4{font-size:.92rem;font-weight:700;margin-top:1em;letter-spacing:0}
p{margin:.3em 0 .8em}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:2px 10px 18px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.brand b{font-weight:800;font-size:1.05rem;letter-spacing:-.02em;display:block}
.brand small{color:var(--muted);font-size:.78rem}
.nav .grp{font-size:.72rem;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.nav button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:8px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--ink);font-size:.93rem}
.nav button:hover{background:var(--surface2)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
[data-theme="dark"] .nav button.active{color:var(--accent)}
.nav .ico{width:20px;text-align:center;opacity:.9}
.side .foot{margin-top:auto;font-size:.76rem;color:var(--muted);padding:12px 10px 0;border-top:1px solid var(--line2);line-height:1.45}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;gap:12px;align-items:center}
.top .crumb{font-weight:700;flex:0 0 auto;min-width:120px}
.top input{flex:1;min-width:120px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.top .ib{padding:8px 11px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer}
#menuBtn{display:none}
.content{padding:26px 26px 60px;max-width:1120px}
.lead{color:var(--muted);max-width:66ch;margin-top:-.2em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel.tight{padding:12px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.section{padding:14px 0 6px;border-top:1px solid var(--line);margin-top:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--line);gap:1px;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.stats .stat{background:var(--surface);padding:14px 16px}
.stat .lab{font-size:.78rem;color:var(--muted)}
.stat .val{font-size:1.55rem;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin:2px 0}
.stat .val.txt{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.thin{height:4px}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.77rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.05);background:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);background:var(--surface);cursor:pointer;user-select:none}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.pri{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.pri::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pri.M{color:var(--red)}.pri.S{color:var(--amber)}.pri.N{color:var(--green)}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.ledger .lh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface2)}
.task{display:grid;grid-template-columns:28px 22px 1fr;gap:12px;padding:13px 18px;border-top:1px solid var(--line2);align-items:start}
.ledger .task:first-of-type,.card .task:first-child{border-top:0}
.task .n{font-size:.78rem;color:var(--muted);font-weight:600;padding-top:3px;text-align:right}
.task input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task.done .n{color:var(--green)}
.task .t{margin:0 0 5px;line-height:1.45}
.task .meta{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.task.cur{background:var(--accent-soft)}
.task.cur .n{color:var(--accent)}
.added{color:var(--amber);font-weight:700;font-size:.74rem}.cloudtag{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:99px;font-size:.72rem;color:var(--accent);background:var(--accent-soft)}
details{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;box-shadow:var(--shadow)}
details>summary{cursor:pointer;padding:13px 16px;font-weight:650;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary>span:first-child{flex:1}
details>summary>span:nth-child(2){white-space:nowrap}
details>summary::after{content:"▸";color:var(--muted);transition:transform .15s}
details[open]>summary::after{transform:rotate(90deg)}
details .body{padding:0 16px 16px}
details.inner{background:var(--surface2);border:0;box-shadow:none;margin:6px 0;border-radius:10px}
details.inner>summary{padding:9px 12px;font-weight:600;font-size:.92rem}
details.inner .body{padding:0 12px 12px}
details.inner .task{padding:10px 6px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.78rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{padding:7px 13px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-size:.9rem}
.tabs button:hover{background:var(--surface2)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
textarea{width:100%;min-height:72px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical;margin:4px 0 12px}
ul.clean{margin:.2em 0 .6em 1.1em;padding:0}ul.clean li{margin:.2em 0}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;border-top:1px solid var(--line2)}
.checks label:first-child{border-top:0}
.checks input{margin-top:4px;accent-color:var(--accent)}
.checks label.on span{color:var(--muted);text-decoration:line-through}
.ring{width:124px;height:124px;flex:0 0 auto}
.hero{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;padding:6px 0 18px}
.hero .kick{color:var(--muted);font-size:.85rem}
.hero .big{font-size:3rem;font-weight:800;letter-spacing:-.045em;line-height:1;margin:2px 0 6px}
.hero .goal{max-width:62ch;margin:.5em 0 0}
.now{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.now .lab{font-size:.74rem;color:var(--muted);font-weight:600}
.now .txt{font-weight:650;line-height:1.35}
.now .nb{font-size:.8rem;color:var(--muted);line-height:1.35;max-width:220px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ctrl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0 10px}
.timer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer .clock{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;min-width:92px;font-variant-numeric:tabular-nums}
select{padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
.hint{background:var(--amber-soft);border-left:3px solid var(--amber);padding:9px 12px;border-radius:8px;font-size:.88rem;margin:8px 0}
.ok{background:var(--green-soft);border-left:3px solid var(--green);padding:9px 12px;border-radius:8px;font-size:.88rem;margin:8px 0}
.warn{background:var(--red-soft);border-left:3px solid var(--red);padding:9px 12px;border-radius:8px;font-size:.88rem;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(8,14,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .card{max-width:520px;width:100%}
.mobnav{display:none}
svg text{font-family:inherit}
.node{cursor:pointer}
.node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node.hl rect{stroke:var(--accent);stroke-width:2.5}
.node.dep rect{fill:var(--accent-soft)}
.node.done rect{fill:var(--green-soft);stroke:var(--green)}
.node text{fill:var(--ink);font-size:11px}
.edge{stroke:var(--line);fill:none;stroke-width:1.3}
.edge.hl{stroke:var(--accent);stroke-width:2.2}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.mini div{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:.72rem;cursor:pointer;background:var(--surface)}
.mini div.full{background:var(--green-soft);border-color:var(--green)}
.mini div.part{background:var(--accent-soft)}
.mini div.cur{outline:2px solid var(--accent)}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.75rem;background:var(--surface2)}
.results .item{padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}
.results .item:hover{background:var(--surface2)}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:.9rem}
.list .li:first-child{border-top:0}
.list .li .w{flex:1;min-width:0}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .content{padding:16px 14px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stat .val{font-size:1.3rem}
  .hero{grid-template-columns:1fr auto;gap:12px}
  .hero .big{font-size:2.4rem}
  .ring{width:92px;height:92px}
  .now{grid-template-columns:1fr}
  .now .nb{max-width:none}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobnav button{border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
  .mobnav button.active{color:var(--accent);font-weight:700}
  .top{padding:8px 12px}.top .crumb{display:none}#menuBtn{display:block}
  table{font-size:.8rem}
  .task{grid-template-columns:20px 22px 1fr;gap:9px;padding:12px 12px}
  .ledger .lh{padding:10px 12px}
}

.side.open{display:flex;position:fixed;inset:0 auto 0 0;width:260px;z-index:40;height:100vh}
.dim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.dim.on{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>Master Roadmap</b><small>Learning OS · MERN → AI Cloud Engineering</small></div>
    <div class="nav" id="nav"></div>
    <div class="foot">Progress is saved in this browser (localStorage). Export a backup from Settings. Press <span class="kbd">/</span> to search.</div>
  </aside>
  <div class="dim" id="dim"></div>
  <div class="main">
    <div class="top">
      <button class="ib" id="menuBtn" aria-label="Menu">☰</button>
      <div class="crumb" id="crumb">Dashboard</div>
      <input id="search" placeholder="Search topics, tasks, weeks, projects, resources…" aria-label="Search">
      <button class="ib" id="themeBtn" title="Toggle dark/light">◐</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="mobnav" id="mobnav"></div>
<div id="modal"></div>
<script>
const DATA={"phases":[{"id":"P0","name":"Launchpad","short":"Baseline + career target","weeks":[1],"goal":"Set the baseline, toolchain and career target: AI Cloud / GenAI Platform Engineering."},{"id":"P1","name":"Foundations + Cloud Core","short":"Python, SQL, Linux, AWS fundamentals","weeks":[2,3,4,5,6,7,8,9],"goal":"Build Python/data foundations while starting cloud, Linux, networking and production habits early—not at the end."},{"id":"P2","name":"Core SWE + Cloud Engineering","short":"OS, DBMS, networks, distributed systems, AWS","weeks":[10,11,12,13,14,15,16,17,18],"goal":"Turn MERN experience into deep software engineering and cloud architecture capability; ship PairCraft with production evidence."},{"id":"P3","name":"GenAI Engineering + Retrieval","short":"RAG, evals, observability, AI platform basics","weeks":[19,20,21,22,23,24,25,26],"goal":"Build AtlasAI and learn retrieval, evaluation, security, model routing and cloud deployment patterns."},{"id":"P4","name":"ML + Deep Learning + Inference","short":"ML, PyTorch, transformers, fine-tuning, GPU","weeks":[27,28,29,30,31,32,33,34,35],"goal":"Understand model internals and inference economics well enough to make production trade-offs."},{"id":"P5","name":"Agents + AI Reliability","short":"Agents, MCP, security, evals","weeks":[36,37,38,39,40,41,42,43],"goal":"Build reliable agentic systems with bounded autonomy, security and measurable quality."},{"id":"P6","name":"AI Cloud Platform + MLOps","short":"Kubernetes, Terraform, CI/CD, serving, SRE","weeks":[44,45,46,47],"goal":"Become an AI-cloud engineer: deploy, scale, secure, observe and optimize AI workloads."},{"id":"P7","name":"Interview + International Conversion","short":"coding, system design, applications, negotiation","weeks":[48,49,50,51],"goal":"Convert the technical profile into strong domestic and international interviews/offers."},{"id":"P8","name":"Final Readiness + Year-2 Strategy","short":"portfolio, maintenance, international move","weeks":[52 roblem review list sprint (W52) with 3 timed sets/week","Design mocks weak → 2 more Tier-1 cases + 1 AI case, recorded and reviewed","Stories weak → record yourself; cut every story to Context → Approach → Trade-offs → Result"]}},"deps":{"nodes":[{"id":"n-setup","label":"Setup & baseline","phase":"P0","week":1},{"id":"n-py","label":"Python","phase":"P1","week":2},{"id":"n-dsa1","label":"DSA D1","phase":"P1","week":2},{"id":"n-data","label":"NumPy/Pandas/SQL/Stats","phase":"P1","week":6},{"id":"n-pc-spec","label":"PairCraft spec","phase":"P1","week":6},{"id":"n-cs","label":"OS · DBMS · CN","phase":"P2","week":10},{"id":"n-dsa2","label":"DSA D2","phase":"P2","week":10},{"id":"n-pc","label":"PairCraft build","phase":"P2","week":10},{"id":"n-llm","label":"LLM APIs + structured outputs","phase":"P2","week":14},{"id":"n-voice","label":"Voice→Notes mini","phase":"P2","week":17},{"id":"n-rag","label":"RAG + embeddings","phase":"P3","week":19},{"id":"n-ir","label":"Hybrid search (IR)","phase":"P3","week":21},{"id":"n-evals","label":"Evals + observability","phase":"P3","week":22},{"id":"n-sda","label":"System design SD-A","phase":"P3","week":19},{"id":"n-dsa3","label":"DSA D3 (DP/greedy)","phase":"P3","week":20},{"id":"n-atlas","label":"AtlasAI flagship","phase":"P3","week":19},{"id":"n-gateway","label":"LLM gateway","phase":"P3","week":25},{"id":"n-gate6","label":"6-month gate","phase":"P3","week":26},{"id":"n-ml","label":"Classical ML","phase":"P4","week":27},{"id":"n-dl","label":"PyTorch + DL","phase":"P4","week":29},{"id":"n-tf","label":"Transformers + GPT","phase":"P4","week":31},{"id":"n-hf","label":"HF + quantization","phase":"P4","week":32},{"id":"n-ft","label":"QLoRA fine-tune","phase":"P4","week":33},{"id":"n-sdb1","label":"ML system design","phase":"P4","week":32},{"id":"n-agents","label":"Agent patterns","phase":"P5","week":36},{"id":"n-fw","label":"Frameworks","phase":"P5","week":37},{"id":"n-mcp","label":"MCP","phase":"P5","week":41},{"id":"n-aevals","label":"Agent evals + red-team","phase":"P5","week":42},{"id":"n-paper","label":"Paper-to-Prod flagship","phase":"P5","week":36},{"id":"n-sdb2","label":"LLM/agent system design","phase":"P5","week":36},{"id":"n-k8s","label":"Docker → K8s → IaC","phase":"P6","week":44},{"id":"n-llmops","label":"MLflow · vLLM · eval-gated deploy","phase":"P6","week":46},{"id":"n-mocks","label":"Mocks + STAR + applications","phase":"P7","week":48},{"id":"n-twin","label":"Digital twin capstone","phase":"P7","week":48},{"id":"n-final","label":"Final readiness","phase":"P8","week":52}],"edges":[["n-setup","n-py"],["n-setup","n-dsa1"],["n-py","n-dsa1"],["n-py","n-data"],["n-py","n-llm"],["n-dsa1","n-dsa2"],["n-dsa2","n-dsa3"],["n-setup","n-pc-spec"],["n-pc-spec","n-pc"],["n-cs","n-pc"],["n-cs","n-sda"],["n-pc","n-voice"],["n-llm","n-voice"],["n-llm","n-pc"],["n-data","n-rag"],["n-llm","n-rag"],["n-rag","n-ir"],["n-ir","n-evals"],["n-rag","n-atlas"],["n-ir","n-atlas"],["n-evals","n-atlas"],["n-evals","n-gateway"],["n-atlas","n-gate6"],["n-sda","n-gate6"],["n-dsa3","n-gate6"],["n-data","n-ml"],["n-ml","n-dl"],["n-dl","n-tf"],["n-tf","n-hf"],["n-hf","n-ft"],["n-ml","n-sdb1"],["n-evals","n-ft"],["n-llm","n-agents"],["n-rag","n-agents"],["n-agents","n-fw"],["n-fw","n-mcp"],["n-evals","n-aevals"],["n-mcp","n-aevals"],["n-agents","n-paper"],["n-aevals","n-paper"],["n-sda","n-sdb2"],["n-hf","n-sdb2"],["n-agents","n-sdb2"],["n-pc","n-k8s"],["n-atlas","n-k8s"],["n-k8s","n-llmops"],["n-ft","n-llmops"],["n-evals","n-llmops"],["n-sdb2","n-mocks"],["n-dsa3","n-mocks"],["n-paper","n-twin"],["n-atlas","n-twin"],["n-llmops","n-twin"],["n-mocks","n-final"],["n-twin","n-final"]]},"coverage":[{"source":"google_6_12_month_engineering_roadmap","topics":"SWE-first strategy; 5-hour block OS; M1–M12 plan; DSA curriculum + protocol + mistake log; full CS curriculum (DSA, OOP/OOD, DBMS, CN, OS, system design, backend, cloud, ML, DL, LLM, MLOps, IR/search, security, frontend, behavioral); 3 flagships (ScaleQueue, AtlasAI, SearchForge); system-design ladder; resume/referral/application engine; monthly scorecard; 6-month compression; non-negotiable rules","location":"Daily block structure → every day; DSA protocol + mistake log → W1 + every DSA task; M1–M3 → P1–P2; M4–M6 → P3; M7–M9 → P4–P5; M10–M12 → P6–P8; AtlasAI → W19–W26 flagship; ScaleQueue → merged into PairCraft job queue (W12–W13); SearchForge → merged into AtlasAI hybrid retrieval + IR topics (W21); OOP/OOD → W25–W28 LLD; security → W15, W24, W42; frontend track → assumed known (MERN) and exercised in every project; behavioral → W40, W42, W48–W51; application engine → W26+, W49; 6-month gate → W26; monthly scorecard → weekly reviews + phase gates"},{"source":"operation-google-blueprint","topics":"Load-bearing assumptions + three levers; target selection (SWE L3/L4 primary, ML/AI signal); Sheets 00–04; full syllabus (DSA, AI/ML, LLD+HLD, OS, DBMS, CN, OOP); PairCraft + Paper-to-Prod flagships; resource stack; Quiet Network referral engine; hour budgets by phase; progress tracker","location":"Sheet 00 → W1; Sheet 01 → P1–P2 (DSA-heavy hours); Sheet 02 → P3–P5 (system design + ML + networking); Sheet 03 → P7; Sheet 04 → W51 Branch A/B + W52 maintenance; PairCraft → W6–W18; Paper-to-Prod → W36–W43; Quiet Network → auto career tasks from W13; syllabus → CS weeks W10–W16, SD W19–W31, W36–W43; OSS PR → W41–W42; mocks 15–20 → W18–W51 weekly + W48–W51 intensive; STAR bank → W40, W42"},{"source":"ai-career-reference","topics":"How-to-use manual; Master Path Steps 0–9; owned-resource map (5 courses); AI Engineer Phases 0–6 with per-topic resources + P1–P7 projects + cert table (ML Specialty retired); DSA track phasing + full NeetCode 150 sheet + 25 India bonus; Agentic AI role (A1–A4, A-P1–A-P5); MLOps role (O1–O3, O-P1–O-P5); System Design SD-A1/A2/B1/B2; CS Fundamentals CS-1–CS-4; Career Intelligence (positioning, channels, loop anatomy, Germany, staying current, FAQ); ₹1 Cr+ playbook; Working Abroad; other roles (MLE, Applied Scientist, PM, FDE, DS, CV, NLP, Architect, Safety, Future roles)","location":"Steps 0–1 → P1; Step 2 → W14–W18; Step 3 → P3; Steps 4–5 → P4; Step 6 → W33–W35 + P5; Step 7 → W42 + P6; Steps 8–9 → Horizon (year 2); NeetCode 150 + bonus → the entire DSA queue (every problem named in a task); SD-A → W19–W31; SD-B1 → W32–W35; SD-B2 → W36–W43; CS-1–4 → W10–W16; P1 → AtlasAI; P2 → W25 gateway; P4 → W17 voice notes; P5 → W33–W35; P7 → capstone; A-P2/A-P3 → W41–W42; O-P5 → W46–W47; Career Intel → W26, W49, Horizon; other role sections, ₹1 Cr playbook, Working Abroad → Horizon (reference-only; not scheduled by design)"},{"source":"career-roadmap-v4","topics":"4-phase 50 LPA plan; MERN→AI skill map; course stack (100xSchool, Krish Naik, Ed Donner ×2, GenAI in Production); 15+ certs; AI infra field analysis; 5 AI niches; 6 startup projects; 6 Shopify apps; 12-week daily plan (env, AWS CCP, TypeScript, Python, GitHub Actions cert, first AI project); goal tracker; PM end game; salary projection; 90-day checklist","location":"Course stack → OWNED resources used as spines (Krish Naik P1/P4, Ed Donner P2–P5, 100xSchool weekly); 12-week daily plan → W1 setup, W4 FastAPI, W16 GitHub Actions cert, W17 first AI project; AI Clinical Notes → W17 mini project; LegalEase/Vernacular Tutor → AtlasAI domain alternatives; TypeScript migration → assumed done (current stack is TS) and enforced in PairCraft; AWS CCP/AI Practitioner → optional W16–W17 (free Skill Builder path); SAA/CKAD/CKA/SAP/GCP-MLE/Azure/POPM/PMP → Horizon cert stack with rationale; AWS ML Specialty → removed (retired Mar 2026); Shopify apps + AgriSense/FactoryMind/HireIQ → Horizon project bank; PM phases 3–4 → Horizon; LinkedIn weekly post → auto career task from W6; goal tracker → this OS"},{"source":"certification-market-report","topics":"15 certs assessed (AIGP, CIPM, CIPP/E, AWS AIP, AWS MLA, GCP MLE, AWS SAA/SAP, CKA, CISSP, PMP, PSM, Salesforce, TOGAF); scarcity/demand; pay by country; Germany Blue Card no-degree route; 12-month cert sequence","location":"AWS ML Engineer Associate → W44–W47 (the one scheduled high-value cert); AWS AI Practitioner → optional W16–W17; CKA, AWS SAA, AIGP → Horizon with sequencing; CIPM/CIPP-E/PMP/CISSP/Salesforce/TOGAF/PSM → Horizon table (not scheduled: out of scope for a year-1 engineering plan); Germany Blue Card route → Horizon"},{"source":"career-trajectory-playbook","topics":"Reality check (PSU vs tech); growth via switches; 3 phases; time budget (25–30 h/week, burnout warning); ₹3L vs ₹50L mindset (11 items); future-proof mindset; daily practice steps; communication skills (9) + build steps (8)","location":"Time budget → 5 h × 6 days + light Day 7 (≈30 h); burnout rule → Recovery Mode + Day 7 rest; “separate job-skill from interview-skill practice” → DSA slot never paused; “switch review every 12 months” → W52 maintenance; “one systems-thinking project per quarter” → flagships designed for 10× load; communication build steps → auto career tasks (explain-to-non-technical weekly from W13; Context→Approach→Trade-offs→Result on every design run; record yourself W48–W50); harsh feedback → PR reviews + OSS; mindset list → Dashboard tips + Horizon"},{"source":"1cr_roadmap","topics":"₹1 Cr in 4 years financial plan: income ladder, tax/expenses math, budget cap, Year 1 = AI/ML courses + 2 real AI projects + switch to product company + MERN freelancing from month 6; job switches every 18–24 months; invest savings","location":"Year-1 learning goals (courses + 2 real AI projects + product-company switch) → the whole 52 weeks (AtlasAI + Paper-to-Prod are the “2 real AI projects”); freelancing from month 6 → noted in Horizon/Recovery as an income lever, not scheduled (would exceed 5 h/day); Years 2–4 income/switch strategy → Horizon"},{"source":"user request (v2): MERN revision","topics":"Revise the MERN stack and everything around it: JavaScript core + async, TypeScript advanced, React rendering/hooks/state/data, Next.js RSC, Node internals, Express/API design, MongoDB modeling + aggregation, auth, browser performance, testing","location":"One 60-min “MERN revision” task every Day 6 from W2 to W13 (12 modules), applied to PairCraft; mastery checkpoint m-mern; sourced from career-roadmap-v4 advanced-MERN list, Google curriculum §15 and the Blueprint stack"},{"source":"user request (v2): DevOps","topics":"Linux admin, Nginx + TLS, Docker images + Compose, advanced GitHub Actions, AWS core + managed services, Prometheus/Grafana, Loki/OpenTelemetry, first Kubernetes deploy, secrets + backups, Terraform/GitOps intro","location":"DevOps track: one hands-on module every Day 6 from W14 to W25, applied to PairCraft (project “Ops for PairCraft”); mastery checkpoint m-devops; the W44–W47 deep dive (K8s, IaC, canary, MLOps) is unchanged and now builds on this"},{"source":"user request (v2): Cybersecurity + Blockchain","topics":"Security mindset, web security labs, crypto for engineers, Linux/network security, supply chain, cloud security, AI security, practice loop; blockchain mechanics, Ethereum, Solidity, contract workflow, dApp frontend, contract security","location":"Side Tracks section (self-paced, outside the 52-week path, not counted in roadmap progress); each module has learn/do/resources/checks and a Study-with-Claude button"},{"source":"user request (v3): JavaScript & MERN refresher","topics":"JS mental model (types, coercion, scope, hoisting), functions/closures/this, prototypes & classes, async & event loop, modern ES features & modules, browser platform, TypeScript, Node internals, Express & API design, MongoDB/Mongoose, React core + advanced, full-stack integration, interview drill (output prediction, polyfills, machine coding)","location":"Side Tracks → 🟨 JavaScript & MERN Refresher (14 modules, ~55 h, JS-heavy) + weekly 20–25 min recall tasks on Day 7 of W2–W52 tagged [ADDED SUPPORTING TOPIC] (3 cycles after W13: explain+implement → predict-output/debug → interview mode). These recall tasks DO count toward progress; the side-track modules do not. Existing W2–W13 Day-6 MERN revision sessions are kept."}],"decisions":[{"title":"One timeline: 52 weeks","text":"Google roadmap and Blueprint are 12-month plans; career-roadmap-v4 and 1cr are 4-year career plans; the reference runs ~24 months. The OS schedules the first 12 months (learning + first conversions). Years 2–4 (PM bridge, specialization lanes, ₹1 Cr, Germany) live in Horizon."},{"title":"DSA in Python","text":"Google roadmap says C++, career-v4 says JavaScript, the reference says Python. Python wins: it doubles as AI-track practice, all owned AI courses use it, and it removes a third language. C++ is only worth it for C++-specific Google reqs — revisit in Horizon if a target JD demands it."},{"title":"DSA volume = 175 problems × 2 passes","text":"Google (350–450) and Blueprint (350–400) count solves; the reference argues 120–150 deeply + a cold second pass. NeetCode 150 + 25 India staples, each re-solved cold 2–4 weeks later ≈ 350 solve-events, plus timed sets and 15+ mocks."},{"title":"DSA hours: 90 → 60 min/day","text":"Blueprint Sheet 01 wants 21 h/week of DSA; Google wants 1 h 45/day; the reference 45–60 min/day. Compromise: 90 min in P1–P2, 75 in P3, 60 in P4–P6, then timed sessions/mocks in P7."},{"title":"Projects consolidated to 3 flagships + capstone + 8 supporting","text":"Sources list ~25 projects. ScaleQueue lives inside PairCraft (queue/workers/DLQ); SearchForge lives inside AtlasAI (BM25 + IR metrics); Clinical Notes + meeting-to-CRM merged into one mini project; startup/Shopify ideas kept in Horizon."},{"title":"Certs are secondary to portfolio","text":"The reference marks CCP/AI Practitioner as resume-filler and confirms AWS ML Specialty was retired on 31 Mar 2026 (career-v4 still recommends it — removed). Scheduled: GitHub Actions (free, W16) and AWS ML Engineer Associate (W44–W47, optional). CKA/SAA/AIGP → Horizon."},{"title":"TypeScript migration removed as a task","text":"career-v4 schedules a TS migration; the Blueprint states TS is already in the current stack. PairCraft is built in TypeScript end-to-end, which exercises it without a separate migration week."},{"title":"Frontend track not scheduled","text":"The Google curriculum lists frontend as a secondary track. As a MERN developer this is assumed; every project ships a real React UI, which is the practice."},{"title":"Web3 track skipped","text":"100xSchool’s Web3 track is optional in career-v4 and absent from every other source; it would be an unrelated technology for this target."},{"title":"Freelancing not scheduled","text":"1cr_roadmap suggests MERN freelancing from month 6. At 5 h/day it cannot fit without cutting DSA or projects; listed in Horizon as an income lever once the first switch lands."},{"title":"MERN revision and DevOps go into the main path; cybersecurity and blockchain go into Side Tracks","text":"Per your request. MERN and DevOps are directly on the target profile (every flagship ships a React UI and must run in production), so they are scheduled on Day 6, the lightest weekday, to keep every day near 5 hours. Cybersecurity and blockchain are useful but not on the critical path, so they live as self-paced side tracks that never displace DSA or a flagship milestone."}],"recovery":{"never_skip":["DSA daily slot (even 30 min: one re-solve). Interview skill decays fastest and is the gate for every loop.","The current flagship’s milestone for the week — shipped evidence is what unlocks roles.","Phase gate assessments — they are the anti-checkbox-theater mechanism.","Weekly review notes — 10 minutes keeps the streak of reflection alive."],"compress":["Theory blocks (OS/DBMS/CN, math intuition): watch at 1.5×, do the “What you should know” questions only, skip the second resource.","Course videos: skip sections you can already answer cold; do the project of the week, not every lecture.","System-design cases: 1 case/week instead of 2; write the delta, skip re-watching.","Career block: batch LinkedIn/network tasks into one 60-minute session per week."],"postpone":["Nice-to-know tasks (🟢) — remove them from the week entirely and continue.","Optional certs (AWS AI Practitioner, AWS MLE-A) — move to Horizon without guilt.","Intermediate projects (gateway, risk model, MCP suite) — cut scope to their first two milestones.","OSS contribution — one PR is enough; later is fine."],"skip_temporarily":["Framework tours (W40 AutoGen/ADK/Strands) — build in one framework well instead of three.","Paper reading and newsletters — zero cost to pause.","Second backup resource on any topic — one spine per topic."],"catch_up":["Step 1 — Do not rewind. Open Today and complete the first unfinished day as written; do not try to “make up” missed days.","Step 2 — Run a 2-day triage: for each missed day, do only its 🔴 MUST KNOW tasks and its DSA problems (cap 5 h/day).","Step 3 — Cut the current week to must-know + the flagship milestone. Mark 🟡 as skipped in your weekly notes.","Step 4 — Re-run the last mastery checkpoint aloud; if ≥4/5 hold, continue; if not, spend one day on the “fail → revisit” items of the last phase gate.","Step 5 — Return to the normal schedule when: DSA slot done 3 days in a row AND the flagship milestone is back on track AND the weekly review is written."],"rules":["After 3+ missed days: do a 2-day triage, then continue.","After 2+ missed weeks: redo the last phase gate first (it takes one day), then continue from the first unfinished day.","After 1+ missed month: re-run the W1 diagnostic (10 problems cold) and the last two mastery checkpoints; keep Day 7 as a rest day for the first two weeks back.","Six or more hours a day burns out in 6–8 weeks (career-trajectory-playbook). Never “catch up” by doubling hours."]},"certs":[{"name":"AWS Certified Solutions Architect – Associate","cost":"$150","when":"W20–W24","status":"CORE — recommended","why":"Best first major cloud credential for this plan. It validates AWS architectural knowledge; use the exam as a structured milestone after hands-on VPC/IAM/EC2/S3/RDS/LB work."},{"name":"HashiCorp Certified: Terraform Associate (004)","cost":"Check current exam price","when":"W28–W32","status":"SUPPORTING — recommended","why":"Useful proof of infrastructure-as-code fundamentals after you have already provisioned real environments. Do not take it before using Terraform in a project."},{"name":"Certified Kubernetes Administrator (CKA)","cost":"$445","when":"W45–W48","status":"CORE — recommended","why":"High-signal, hands-on, vendor-neutral Kubernetes credential. Schedule only after you can deploy, debug, network, secure and scale a real workload on Kubernetes."},{"name":"AWS Certified Machine Learning Engineer – Associate","cost":"$150 (verify at scheduling)","when":"W47–W50","status":"CORE — recommended after project gate","why":"Strong match for AI-cloud/ML platform work. AWS is updating MLA-C02 in 2026, adding broader GenAI/agent/foundation-model coverage; use the currently available exam guide when booking."},{"name":"GitHub Actions Certification","cost":"Check current exam price","when":"W16–W18","status":"OPTIONAL","why":"Legitimate GitHub credential, but lower priority than AWS/CKA/Terraform. Earn it only if you want external validation for CI/CD."},{"name":"AWS Certified AI Practitioner","cost":"~$100","when":"Optional, early","status":"LOW PRIORITY","why":"Foundational AI credential. Useful for non-technical AI literacy, but redundant once you can implement and deploy production AI systems."},{"name":"GCP Professional Machine Learning Engineer","cost":"$200 + tax","when":"Year 2+","status":"DEFER","why":"Excellent certification, but Google recommends 3+ years industry experience including 1+ year designing/managing GCP solutions. Earn after real GCP experience, not during this first-year sprint."},{"name":"AWS Certified Solutions Architect – Professional","cost":"Check current exam price","when":"Year 2+","status":"DEFER","why":"Advanced architecture signal; much more valuable after meaningful production AWS experience. The exam is being updated to SAP-C03 in late 2026."},{"name":"AWS Security – Specialty","cost":"$300","when":"Year 2+ only if security/DevSecOps specialization","status":"OPTIONAL SPECIALIZATION","why":"Strong credential for cloud security, but AWS positions it for experienced practitioners. Do not divert first-year effort from core AI-cloud skills."},{"name":"Removed from plan: AWS ML Specialty","cost":"—","when":"Removed","status":"RETIRED","why":"Do not follow old roadmap references to the retired ML Specialty; use AWS Machine Learning Engineer – Associate instead."}],"horizon":[{"title":"Months 13–18 — First switch + specialization fork","text":"Take the strongest offer as the platform (Blueprint Branch B is normal). Keep DSA at 3–4 h/week. Pick ONE lane from the reference Step 8: LLMOps deep, Forward-Deployed Engineer, Indic NLP, CV, Safety, or Applied Science. Certs: CKA, then AWS SAA if a filter needs it."},{"title":"Months 18–24 — Seniority layer","text":"Reference Step 9: DDIA-level distributed design, multi-tenant AI platform architecture, RFCs/ADRs, one public talk or essay (StaffEng). Google roadmap “switch review” every 12 months; negotiate every offer with market bands in hand."},{"title":"Years 2–3 — AI Platform / Agentic senior track","text":"career-roadmap-v4 Phase 2–3: LLMOps, AI system architecture, technical leadership, GenAI in Production course (buy at month 18+), AWS SAP, GCP MLE. Project bank: AgriSense, FactoryMind, HireIQ, the 6 Shopify apps — pick by pull and revenue potential."},{"title":"Years 3–4 — Technical AI PM bridge (optional)","text":"career-roadmap-v4 Phase 4 + reference AI PM section: PRDs, eval-driven product thinking, POPM → PMP, Reforge. Only if the pull is real; infra as a skill layer, not an identity."},{"title":"Income levers (1cr_roadmap, career-trajectory-playbook)","text":"Switch every 18–24 months for 40–60% jumps; cap expenses; invest savings from month 1; MERN freelancing (Toptal/Contra) once the first switch lands; AI consulting from year 3; remote USD roles in year 4."},{"title":"Germany / EU (certification report, reference CI-4, Working Abroad)","text":"Blue Card or the no-degree IT-specialist route (3 yrs experience + recognized certs + employer reference). Start A2–B1 German 15 min/day from month 12. Re-verify thresholds on make-it-in-germany.com."},{"title":"Communication muscle (career-trajectory-playbook)","text":"Keep the three weekly habits: explain one technical thing to a non-technical person; force Context → Approach → Trade-offs → Result; practice the disagreement script. Negotiate something small every month."},{"title":"Staying current (reference CI-5)","text":"Two newsletters max (Latent Space + one more); follow builders who publish measurements; one paper/month; quarterly 15-minute self-audit of this roadmap."}],"final":{"Concepts understood":["Python, data stack, SQL, stats/math intuition","OS · DBMS · CN vocabulary at interview precision","LLM foundations: tokens, context, sampling, hallucination","RAG, IR metrics, evals, observability","Classical ML, DL, attention, fine-tuning","Agent patterns, MCP, reliability math","System design SD-A + SD-B (ML + LLM/agents)","Production: containers, K8s, CI/CD, IaC, SLOs","JavaScript & MERN internals from memory: event loop, closures/this, prototypes, React rendering model, Node streams, Express error flow, Mongo indexes"],"Coding skills":["NeetCode 150 + 25 bonus, first pass complete","Second cold pass ≥150 problems","4/5 unseen mediums ≤35 min narrating","BFS/DFS/topo/DSU/heap/DP from memory","Timed sets and ≥15 mocks logged"],"Practical skills":["FastAPI service with pydantic, async, tests","Job queue with retries/DLQ/idempotency","RAG with hybrid retrieval + reranker + eval CI","QLoRA fine-tune tracked in W&B, served on vLLM","Hand-written ReAct loop + LangGraph durable state","MCP server built and secured","Eval-gated deploy with canary + rollback"],"Projects completed":["PairCraft (beta + postmortem + resume bullets)","AtlasAI (beta + public eval report + benchmark)","Paper-to-Prod (demo + eval + red-team report)","Voice→Notes, gateway, risk model, small GPT, invoice extractor, MCP suite, LLMOps pipeline"],"GitHub / portfolio ready":["3 flagship repos pinned with README → architecture → eval/benchmark → limitations","Tutorial-clone repos unpinned or deleted","2–4 technical writeups published","Demo videos for each flagship","Consistent contribution graph"],"Deployment completed":["Every flagship behind a public HTTPS URL","AtlasAI on Kubernetes with probes + HPA","Cost per conversation/doc known and documented","Capstone on your own domain (<₹500/month)"],"Interview preparation completed":["Resume v2 per role family (AI Eng / SWE)","LinkedIn headline + featured demos","2-minute intro recorded and tight","10–12 STAR stories rehearsed","Project defense for each flagship rehearsed","Negotiation prep with market bands"],"Mock assessments passed":["All 7 phase gates passed","All 16 mastery checkpoints ticked","Full HLD mock ×2, AI design mock ×1, coding mocks ≥15"],"Final project completed":["Career digital twin deployed with public eval + cost dashboard","Engineering blog post published","Red-team suite results published"]},"side":[{"id":"mern","name":"JavaScript & MERN Refresher","emoji":"🟨","note":"The one side track that IS wired into the main path: it exists because MERN — especially JavaScript — is your current stack and it keeps fading. Do the modules here in order during Day 7 spare time (or 2–3 evenings a week for the first 8 weeks); the weekly 20–25 min recall tasks on Day 7 of W2–W52 (tagged [ADDED SUPPORTING TOPIC]) keep it alive and DO count toward roadmap progress. Rule: never read without typing — every module ends with something you built from memory.","hours":"~55 h total (JS ≈ 55%)","modules":[{"title":"JS mental model: values, types, coercion, scope, hoisting","hours":4,"learn":"Primitives vs objects (copy vs reference), typeof/instanceof quirks, == vs === and the ToPrimitive/ToNumber coercion rules, truthy/falsy, NaN, hoisting of var/function vs TDZ for let/const, block vs function scope, execution context + creation phase, the global object, strict mode.","do":"Write coercion.js with 20 expressions ([] + {}, [] == ![], '5' - 2, null >= 0 …) — predict, run, explain each in one line. Then write a 10-snippet hoisting/TDZ quiz for yourself and pass it cold the next day.","res":["js-info","ydkjs","mdn-js"],"check":["Predict 18/20 coercion outputs and explain the rule behind each","Explain hoisting vs TDZ with a runnable example of each","Draw the creation vs execution phase of an execution context from memory"]},{"title":"Functions deep-dive: closures, this, call/apply/bind, HOFs","hours":5,"learn":"Lexical scope + closures (why loops with var break), the 4 rules of `this` (default, implicit, explicit, new) + arrow functions’ lexical this, call/apply/bind, IIFE, currying, partial application, higher-order functions, pure functions, the module pattern.","do":"Implement from memory: once, memoize (with Map cache key), debounce (leading/trailing), throttle, curry(fn), compose/pipe, a counter factory, and your own Function.prototype.myBind. Write a test file that proves each.","res":["js-info","ydkjs","mdn-js"],"check":["Write debounce + throttle + curry cold in ≤15 min with tests passing","State the 4 `this` rules and predict `this` in 8 snippets (method, extracted method, arrow in method, setTimeout callback…)","Explain a closure with the var-in-loop bug and the two fixes (let, IIFE)"]},{"title":"Objects, prototypes, classes, iterators & generators","hours":4,"learn":"Prototype chain lookup, __proto__ vs prototype, Object.create, constructor functions vs ES6 classes (fields, #private, static, getters/setters, super), inheritance vs composition/mixins, property descriptors, Object.freeze, Symbol, Symbol.iterator, generators, for…of vs for…in, getters and Proxy basics.","do":"Build the same Animal → Dog hierarchy three ways (prototype chain by hand, constructor+prototype, class) and prove they behave identically. Implement a Range class that is iterable with a generator, and a tiny observable store using Proxy.","res":["js-info","ydkjs","mdn-js"],"check":["Draw the prototype chain for a class instance including Function and Object","Explain how `class` desugars to prototypes","Write an iterable with a generator without notes"]},{"title":"Async JavaScript: event loop, promises, async/await","hours":6,"learn":"Call stack, Web APIs, macrotask (task) vs microtask queues, rendering steps, promise states and chaining, error propagation (why a missing return breaks a chain), Promise.all/allSettled/race/any, async/await as promise sugar, sequential vs parallel awaits, unhandled rejections, AbortController, event emitters, timers.","do":"Implement MyPromise (then/catch/finally, chaining, microtask scheduling with queueMicrotask) and pass a 15-case test. Implement Promise.all, allSettled, race and a promisify helper from memory. Then take 25 ordering snippets (setTimeout / Promise / queueMicrotask / async function mixes), predict output, run in Loupe / Node.","res":["jake-loop","loupe","js-info","js-questions"],"check":["Predict 12/12 event-loop ordering snippets correctly","Implement Promise.all + allSettled cold in ≤10 min","Explain why `await` in a for-loop is sequential and how to parallelize safely with a concurrency limit"]},{"title":"Modern JS toolkit: ES6+, collections, immutability, modules, errors","hours":4,"learn":"Destructuring, spread/rest, default params, template literals, optional chaining/nullish coalescing, array methods (map/filter/reduce/flatMap/find/some/every/sort comparator pitfalls), Map/Set/WeakMap/WeakRef, structuredClone vs JSON deep copy, immutability patterns, Date/Intl basics, RegExp basics, ESM vs CommonJS (loading, live bindings, top-level await), Error subclasses and cause, try/catch/finally.","do":"Implement deepClone (handles cycles via WeakMap), flatten(arr, depth), groupBy, chunk, uniqueBy, and a LRU cache with Map. Convert one small CJS project to ESM and document the 5 things that broke.","res":["js-info","mdn-js"],"check":["Write deepClone with cycle handling cold","Explain ESM vs CJS: hoisting of imports, live bindings, `this`, default interop","Use reduce to build an index/groupBy without looking up the signature"]},{"title":"Browser platform: DOM, events, fetch, storage, rendering","hours":4,"learn":"DOM traversal/manipulation, event flow (capture → target → bubble), delegation, passive listeners, custom events, fetch + streaming + AbortController, CORS (simple vs preflight), cookies vs localStorage vs IndexedDB, the rendering pipeline (style → layout → paint → composite), reflow vs repaint, requestAnimationFrame, IntersectionObserver, Web Workers, Core Web Vitals.","do":"Build a vanilla-JS todo app with event delegation, optimistic UI and fetch to a mock API — no framework. Add an infinite-scroll list with IntersectionObserver and measure layout thrash with DevTools Performance, then fix it.","res":["mdn-js","webdev","js-info"],"check":["Explain event delegation and implement it for a dynamic list","Explain a CORS preflight and which headers trigger it","Name what causes reflow vs repaint and one fix for each"]},{"title":"TypeScript essentials for MERN","hours":3,"learn":"Structural typing, interfaces vs type aliases, unions + narrowing + discriminated unions, generics with constraints, utility types (Partial/Required/Pick/Omit/Record/ReturnType/Awaited), keyof/typeof/indexed access, satisfies, unknown vs any, strict mode flags, typing Express handlers and React props/hooks, zod for runtime + static types.","do":"Type a small API client (fetchJson<T>, typed error union, Result type) with zero `any`; type a React form component with generic field config. Turn on strict and fix every error in one existing project.","res":["ts-hb"],"check":["Write a generic Result<T,E> + narrowing without notes","Explain when to use interface vs type, unknown vs any","Type a custom hook’s return tuple correctly"]},{"title":"Node.js internals: event loop phases, streams, modules, processes","hours":4,"learn":"Node event-loop phases (timers → pending → poll → check → close), process.nextTick vs setImmediate vs setTimeout(0), libuv thread pool, streams (readable/writable/transform, pipeline, backpressure), Buffers, fs/path, EventEmitter, child_process vs worker_threads vs cluster, environment/config, npm scripts, package.json exports, semver, lockfiles.","do":"Stream a 1 GB file through a gzip transform with pipeline() and observe memory. Write an EventEmitter-based job runner with graceful shutdown on SIGTERM. Prove the nextTick/setImmediate ordering with a script and explain it.","res":["node-loop","node-docs","node-best"],"check":["Draw Node’s event-loop phases and place nextTick/microtasks correctly","Explain backpressure and show it with pipeline()","Explain when to use worker_threads vs cluster vs child_process"]},{"title":"Express & API design done right","hours":4,"learn":"Middleware order and next(err), async error handling (express-async-errors or wrapper), routers and versioning, validation with zod, REST conventions (status codes, pagination, filtering, idempotency keys), auth middleware (JWT access/refresh, sessions + cookies), rate limiting, helmet/CORS, structured logging (pino), request IDs, health checks, layered structure (routes → controllers → services → repos).","do":"Build a reference API (users + posts) with the full layered structure, zod validation, central error handler, JWT auth with refresh rotation, rate limiting and supertest tests — fresh, from memory, in one sitting. Diff it against an old project and list what you would change there.","res":["express","node-best","owasp-cheat"],"check":["Explain middleware ordering and why error middleware needs 4 args","Implement access + refresh rotation and name 2 attacks it prevents","Produce a correct pagination + idempotent POST design in 5 min"]},{"title":"MongoDB & Mongoose: modelling, aggregation, indexes","hours":4,"learn":"Document modelling (embed vs reference, bounded arrays, bucket pattern), CRUD operators, aggregation pipeline ($match/$group/$lookup/$unwind/$project/$facet/$addFields), indexes (compound, ESR rule, covered queries, TTL, text), explain() and COLLSCAN vs IXSCAN, transactions, change streams, Mongoose schemas/validation/middleware/virtuals/populate/lean, connection handling and pooling.","do":"Model a blog with comments + tags three ways and argue the trade-offs. Write 10 aggregation queries against a sample dataset; use explain() to fix 2 slow ones with the right compound index. Add Mongoose pre-save hashing + a virtual + populate to one model.","res":["mongo","mongoose"],"check":["Explain embed vs reference with a rule of thumb and 2 exceptions","Write $lookup + $group + $project cold and read its explain()","State the ESR rule and design a compound index for a given query"]},{"title":"React core: rendering model, state, effects, refs, forms","hours":5,"learn":"JSX → createElement, components as functions of props/state, render → commit phases, reconciliation and keys, state batching, immutability of state, controlled vs uncontrolled inputs, useEffect rules (deps, cleanup, sync-with-external-system), stale closures, useRef for values and DOM, lifting state, composition over inheritance, context and its re-render cost, error boundaries, Strict Mode double-invoke.","do":"Build a 300-line app (searchable, sortable, paginated table with a form) with zero libraries. Deliberately create a stale-closure bug and an infinite effect loop, then fix and explain both. Profile with React DevTools and remove one unnecessary re-render.","res":["react-dev","react-patterns"],"check":["Explain render vs commit and what triggers a re-render","Fix a stale-closure and an effect dependency bug on sight","Explain why keys matter with a concrete reordering bug"]},{"title":"React advanced: performance, hooks, data fetching, routing, state libs","hours":4,"learn":"React.memo/useMemo/useCallback (when they help and when they hurt), custom hooks design, useReducer, context splitting, Suspense + lazy, error boundaries, TanStack Query (caching, invalidation, mutations, optimistic updates), Zustand vs Redux Toolkit vs context, React Router data APIs, forms with react-hook-form + zod, accessibility basics, Next.js App Router server vs client components.","do":"Refactor the module-11 app: extract 3 custom hooks, move server state to TanStack Query with optimistic updates, add code-split routes and an error boundary. Measure bundle size before/after.","res":["react-dev","tanstack","nextjs"],"check":["Explain when useMemo is a net negative","Implement an optimistic mutation with rollback","Compare context vs Zustand vs Redux Toolkit for 3 concrete scenarios"]},{"title":"Full-stack integration: auth end-to-end, realtime, testing, deploy","hours":4,"learn":"Monorepo/project structure, env/config, auth flow end-to-end (cookie vs bearer, refresh, protected routes on the client), file uploads (multer → S3/presigned URLs), WebSockets/Socket.IO basics, CORS + proxies in dev, testing pyramid (Vitest, React Testing Library, supertest, Playwright), Dockerfile + compose for MERN, CI, deploy (Render/Railway/Vercel + Atlas), logging and health checks in prod.","do":"Ship a small full-stack app end-to-end in a weekend: login → protected dashboard → CRUD → realtime notifications, with 10 tests across the pyramid and a Dockerized deploy. Write a 1-page ‘how it works’ doc from memory.","res":["node-best","playwright","vitest","socketio"],"check":["Draw the end-to-end auth flow (client, API, DB, cookies) from memory","Explain the testing pyramid and what each layer catches","Deploy a MERN app with env secrets handled correctly"]},{"title":"Interview drill: output prediction, polyfills, machine coding","hours":4,"learn":"The standard JS interview bank: predict-the-output (event loop, this, hoisting, closures, coercion), polyfills (map/filter/reduce/bind/call/apply, Promise.all, debounce, deepClone, flatten, curry, EventEmitter, LRU), React machine-coding rounds (autocomplete, infinite scroll, modal, star rating, tabs), Node/DB design questions.","do":"Do 50 questions from the Lydia Hallie bank in 2 sittings; log every miss in mistakes.md with the rule you missed. Then write all 12 polyfills cold in one 60-min timed session. Do 2 React machine-coding tasks in 45 min each with a timer.","res":["js-questions","js-info","react-dev"],"check":["≥45/50 on the question bank on a second cold pass","12 polyfills in ≤60 min with passing tests","Autocomplete with debounce + abort + keyboard nav in 45 min"]}]},{"id":"cyber","name":"Cybersecurity basics","emoji":"🛡️","note":"Not part of the 52-week path — a self-paced side track (the main path already covers web security in W15/W24 and AI security in W42; the Google curriculum §14 lists Security as a topic). Do modules in Day 7 spare time or after W52. Progress here does not count toward roadmap progress.","hours":"~35 h total","modules":[{"title":"Security mindset & the vocabulary","hours":3,"learn":"CIA triad, threat models, attack surface, defense in depth, least privilege, the difference between vulnerability / exploit / risk.","do":"Write a one-page threat model for PairCraft: assets, attackers, entry points, top 5 risks, mitigations.","res":["owasp-top10","owasp-cheat"],"check":["Explain CIA + defense in depth with PairCraft examples","Name PairCraft’s top 5 risks and a mitigation each"]},{"title":"Web security hands-on: injection & XSS","hours":6,"learn":"SQL/NoSQL injection, XSS (stored/reflected/DOM), output encoding, CSP.","do":"PortSwigger Academy: complete the SQL injection + XSS apprentice labs. Add a CSP header and a NoSQL-injection test to one of your apps.","res":["portswigger"],"check":["Exploit and then fix a reflected XSS in a lab","Write a CSP that blocks inline scripts without breaking your app"]},{"title":"Web security hands-on: auth, CSRF, SSRF, access control","hours":6,"learn":"Broken auth, session fixation, CSRF tokens vs SameSite, SSRF, IDOR/broken access control, rate limiting.","do":"PortSwigger Academy: authentication, CSRF, access-control and SSRF apprentice labs. Audit AtlasAI’s tenant isolation for IDOR.","res":["portswigger","owasp-cheat"],"check":["Explain SameSite vs CSRF tokens","Find and fix one IDOR in your own code"]},{"title":"Crypto for engineers","hours":4,"learn":"Hashing vs encryption vs signing; symmetric vs asymmetric; TLS handshake; password hashing (argon2/bcrypt) and why not SHA-256; JWT pitfalls (alg=none, weak secrets, no expiry).","do":"Implement a tiny HMAC-signed token, then break your own JWT config in 3 ways and fix each.","res":["owasp-cheat"],"check":["Explain why bcrypt beats SHA-256 for passwords","List 3 JWT misconfigurations and fixes"]},{"title":"Linux & network security","hours":6,"learn":"Firewalls, SSH hardening (keys, no root, fail2ban), open ports, nmap in your own lab, log review, file permissions, privilege escalation basics.","do":"OverTheWire Bandit levels 0–15; harden your PairCraft VM (SSH keys only, ufw, fail2ban, unattended upgrades) and scan it with nmap before/after.","res":["overthewire","missing"],"check":["Bandit level 15 reached","nmap shows only 80/443/22 on your VM"]},{"title":"Supply chain & secrets","hours":3,"learn":"Dependency vulnerabilities, lockfiles, SBOM, typosquatting, secret leakage, pre-commit scanners, image scanning.","do":"Add Trivy + gitleaks + npm audit/pip-audit to one CI pipeline; fix what they find; rotate one leaked-on-purpose secret.","res":["trivy","owasp-cheat"],"check":["CI fails on a critical CVE","Pre-commit blocks a committed API key"]},{"title":"Cloud security basics","hours":3,"learn":"IAM least privilege, public S3 misconfiguration, security groups, secrets managers, audit logs, shared-responsibility model.","do":  {id:'tutor',name:'Full tutor session (teach → practice → test → report)',when:'Use once per topic. Paste at the start of a new Claude chat.',

1. Ask me 8 rapid-fire questions across all of this week's topics (mixed: explain / compute / spot the bug). All at once; grade after I answer.
2. Produce a report: score, strong, weak (ranked), and for each weak item a 20-minute drill I can do this week and the exact sub-topic to re-read.
3. Tell me honestly whether I should move to Week {NEXT_WEEK} or spend one more day on the weak items. Use this rule: move on if I scored ≥6/8 and no 🔴 must-know concept failed.
4. Give me 3 spaced-repetition questions to answer in 2 weeks.
5. Rewrite my "what I learned" note as a tight one-screen summary with one diagram.`},

Context: I'm a MERN developer learning AI engineering; Week {WEEK} ("{WEEK_TITLE}").`},

function tutorCtx(){const t=sub.tutorTask?TBYID[sub.tutorTask]:null;const D=t?DAYS[t.dayIdx]:DAYS[curDayIdx()];const w=D.w;const ph=PH[w.phase];const topic=sub.tutorTopic||(t?t.t.split(/[.—:]/)[0].replace(/^DSA · [^:]+: /,'').trim():w.topics[0]);const ms=DATA.mastery.find(m=>w.n<=parseInt(m.week.slice(1))&&m.items.some(()=>true))||DATA.mastery[0];const res=t&&t.res?DATA.resources[t.res].name:(w.res[0]?DATA.resources[w.res[0]].name:'the week\'s primary resource');return {PHASE:ph.name,WEEK:w.n,WEEK_TITLE:w.title,TASK:t?t.t:('Study the topic: '+topic),WEEK_TOPICS:w.topics.join(', '),RESOURCE:res,CHECKPOINT:ms?ms.name+': '+ms.items.join('; '):'',MIN:t?t.min:60,TOPIC:topic,NEXT_WEEK:w.n+1}}
function fillPrompt(body,ctx){return body.replace(/\{(\w+)\}/g,(m,k)=>ctx[k]!==undefined?ctx[k]:m)}
function vTutor(){const ctx=tutorCtx();const open=sub.prompt||'tutor';return `<h1>Study with Claude</h1><p class="lead">Ready-made prompts that turn Claude into a tutor: it teaches with diagrams and examples, makes you practice, then tests you and reports what to re-study. Placeholders are filled from your current position; edit the topic below and copy.</p>
 <div class="panel"><div class="row" style="align-items:flex-end"><label style="flex:1;min-width:220px"><span class="small muted">Topic / task to study</span><input id="tutorTopic" value="${esc(ctx.TOPIC)}" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:4px"></label><div class="small muted">Context: ${esc(ctx.PHASE)} · Week ${ctx.WEEK} · ${esc(ctx.RESOURCE)}</div></div><div class="tiny muted" style="margin-top:8px">Workflow: open a new Claude chat → paste one prompt → follow its steps → when it says “test me” or you finish, take the test → read the report → tick the mastery checkpoint only if the verdict is “Mastered”. Copy weak items into your Weekly review notes.</div></div>
 ${PROMPTS.map(pr=>`<details ${open===pr.id?'open':''}><summary><span>${esc(pr.name)}</span><span class="muted small">${esc(pr.when)}</span></summary><div class="body"><div class="row between" style="margin-bottom:8px"><span class="tiny muted">Filled with your current context. Edit anything in the box before copying.</span><button class="btn sm primary" data-copy="${pr.id}">Copy prompt</button></div><textarea id="pt-${pr.id}" style="min-height:260px;font-size:.86rem;line-height:1.45">${esc(fillPrompt(pr.body,ctx))}</textarea></div></details>`).join('')}
 <div class="panel"><h3>Tips that make these work</h3><ul class="clean small"><li>One topic per chat. Start a fresh chat for each task so the report is about one thing.</li><li>Paste your own code and your own explanation — the value is in Claude correcting <em>your</em> attempt, not producing a perfect one.</li><li>Ask for a Mermaid diagram if you want something you can paste into your notes; ask for ASCII if you want something you can redraw from memory.</li><li>Never tick a mastery item because the session felt good; tick it when the test report says “Mastered”.</li><li>Keep the report: paste “Weak” items into Weekly Plan → Review so Day 7 revision targets them.</li></ul></div>`}

function vSide(){const open=sub.side;return `<h1>Side tracks</h1><p class="lead">Self-paced tracks. 🟨 JavaScript &amp; MERN Refresher is the exception: it feeds the weekly recall tasks on Day 7 of W2–W52 (which DO count toward progress) — do its modules in order alongside the main path. The others sit outside the 52-week path, never count toward roadmap progress and must never displace a DSA slot or a flagship milestone.</p>
 ${DATA.side.map(tr=>{const keys=[];tr.modules.forEach((m,i)=>m.check.forEach((_,j)=>keys.push(`st:${tr.id}:${i}:${j}`)));const d=keys.filter(k=>S.checks[k]).length;const pc=pct(d,keys.length);return `<details id="st-${tr.id}" ${open===tr.id||(!open&&tr===DATA.side[0])?'open':''}><summary><span>${tr.emoji} ${esc(tr.name)} <span class="muted small">· ${tr.modules.length} modules · ${esc(tr.hours)}</span></span><span class="muted small">${pc}%</span></summary><div class="body">${bar(pc,true)}<p class="small muted">${esc(tr.note)}</p>${tr.modules.map((m,i)=>{const done=m.check.every((_,j)=>S.checks[`st:${tr.id}:${i}:${j}`]);return `<details class="inner" id="sd-${tr.id}-${i}"><summary><span>${done?'✅':'◻'} ${i+1}. ${esc(m.title)} <span class="muted tiny">· ~${m.hours} h</span></span></summary><div class="body"><p class="small" style="margin-top:8px"><strong>Learn:</strong> ${esc(m.learn)}</p><p class="small"><strong>Do:</strong> ${esc(m.do)}</p><div class="small"><strong>Resources:</strong> ${m.res.map(k=>link(k)).join(' · ')}</div><h4>Checks (tick when true without notes)</h4>${checks(`st:${tr.id}:${i}:`,m.check)}<div class="row" style="margin-top:8px"><button class="btn sm" data-sidetutor="${esc(m.title)}">🤖 Study this with Claude</button></div></div></details>`}).join('')}</div></details>`}).join('')}`}

 reality:[
  ["What is true about a 1 Cr package","1 Cr (≈ $120k) is a real, common number in this field — but it is a mid-career number. In India it is what Nvidia / Apple / Qualcomm / AMD / Micron / Google-Microsoft silicon teams pay engineers with roughly 7–12 years (base + RSUs), or 5–7 years for top performers at RSU-heavy companies. Abroad it is what a 3–5 year hardware engineer at a large US company earns (USD 150–250k total), or a senior engineer in Europe / Singapore. Nobody gets 1 Cr as a fresher. The plan below is therefore a 3-step ladder: get in (Year 0–1) → get into a product company (Year 1–4) → go senior or go abroad (Year 4–8)."],
  ["What is true about 'small openings'","Openings look small because 70% of entry-level hiring happens through referrals, campus pipelines (IIT/NIT M.Tech) and design-services firms, not job boards. The fix is not more applications; it is (1) proof that replaces the degree (silicon + GitHub + coverage reports), (2) a referral-first outreach system, and (3) applying to the right door — design-services companies and staffing partners are the widest entry door for non-M.Tech candidates."],
  ["What replaces the M.Tech","Hiring managers use the M.Tech as a proxy for: 'has written RTL that synthesises', 'has debugged a testbench', 'has read a timing report'. You will replace the proxy with the thing itself: a RISC-V core that passes the official RISC-V tests, a UVM environment with published coverage numbers, a GDS you closed timing on, a chip you actually taped out (Tiny Tapeout), plus NPTEL certificates from IIT professors with your exam rank. Put those four things in the first three lines of your resume and the degree question mostly disappears."],
  ["Pick a lane — you cannot be hired for 'VLSI'","Companies hire for a lane. For an EE graduate without an M.Tech, in order of hiring volume: (1) Design Verification (DV) — largest headcount, most open to self-taught engineers, SystemVerilog/UVM; (2) RTL Design — needs DV-level knowledge plus architecture; fewer fresher seats; (3) Physical Design / STA — large headcount, tool-driven, services firms hire heavily; (4) DFT — smaller but under-supplied and well paid; (5) Analog / Mixed-signal — realistically needs an M.Tech; not this track. Recommended: DV as your primary lane, RTL as your secondary (the projects below build both), with STA/PD literacy for interviews."],
  ["How this fits with your main roadmap","The main roadmap is a full-time 52-week plan; this track is ~850 hours. Doing both at full intensity is a burnout plan, so decide: (A) VLSI-primary — pause the main roadmap after Phase P1 (Foundation), keep Python + DSA (3 problems/week) because Python scripting is a real VLSI skill and DSA is asked by Synopsys/Cadence/Nvidia R&D; run this track at 3–4 h/day and you reach applications in ~8–9 months. (B) SWE-primary — run this at 1 h/day as a side track; it becomes a 24–30 month path. Choose A if you are sure about chips; do not run both at 100%."]
