    "I can explain how a virtual sequence coordinates two agents"]},
   {title:"Verification planning, debug and gate-level",hours:22,learn:"Verification plan (features → tests → coverage), spec reading and question lists, reviewing waveforms efficiently, X-propagation and X-pessimism, gate-level simulation with SDF back-annotation, power-aware simulation (UPF) idea, formal verification intro (bounded proofs, assumptions, cover), equivalence checking idea, what regressions and triage look like in a real team.",do:"Write a vplan for your AXI4-Lite VIP in a spreadsheet; run a gate-level sim of your UART netlist from Yosys with timing; write 5 formal properties in SymbiYosys for the arbiter.",res:["bergeron","symbiyosys","vacademy"],check:["I have a written vplan with feature → test → coverage mapping","I ran a gate-level simulation and can explain an X on a reset-less flop","I can explain formal vs simulation trade-offs with an example"]},
   {title:"Python-based verification (cocotb) — your unfair advantage",hours:20,learn:"cocotb coroutines, triggers, drivers/monitors in Python, cocotb-bus, pytest-style test discovery, running against Verilator/Icarus, scoreboards using Python models, generating coverage with cocotb-coverage, when teams use Python vs UVM.",do:"Port the AXI4-Lite testbench to cocotb and run the same tests with Verilator; add a Python golden model for the RISC-V core (or drive Spike co-simulation).",res:["cocotb","verilator","pyuvm"],check:["I have cocotb tests running in CI for at least two IPs","I can explain to an interviewer when cocotb fits and when UVM is mandatory"]}
  ]},
  {id:"V4",name:"Synthesis + Static Timing Analysis",hours:70,goal:"Read any timing report, write the SDC for any block, and explain every STA term an interviewer can throw (this is asked in RTL, DV and PD interviews alike).",modules:[
   {title:"Logic synthesis",hours:18,learn:"RTL → generic → mapped netlist, technology libraries (.lib: cells, arcs, lookup tables), wire-load vs physical synthesis, optimisation (constant propagation, retiming, resource sharing), DFT-aware synthesis, clock-gating insertion, area/power/timing reports, hierarchy vs flatten, ungroup, don't-touch.",do:"Synthesise your RISC-V core with Yosys + ABC to sky130; produce area and cell reports; try two optimisation settings and explain the delta.",res:["yosys","weste","teman","nptel-vlsipd"],check:["I can explain what a .lib timing arc is and how a cell delay is looked up","I can read a synthesis area report and find the biggest hierarchy"]},
   {title:"STA fundamentals",hours:26,learn:"Timing paths (reg2reg, in2reg, reg2out, in2out), launch/capture, setup and hold equations, slack, clock skew (positive/negative), latency, uncertainty, jitter, clock-to-Q, recovery/removal, PVT corners, OCV/AOCV/POCV and derates, CRPR, multi-cycle and false paths, half-cycle paths, latch time borrowing, clock gating checks, max transition/capacitance/fanout (DRVs), timing across corners and modes (MMMC), signal integrity (crosstalk delay/noise).",do:"Run OpenSTA on your synthesised core with an SDC; make it fail setup, then hold; fix each with a design change and a constraint change; document both. Solve 20 numeric setup/hold problems with skew and uncertainty.",res:["bhasker","vlsiexpert","opensta","teamvlsi"],check:["I can derive setup and hold slack with skew, jitter and uncertainty on a whiteboard","I can explain OCV vs POCV and why derates are applied differently to launch and capture","I can list six ways to fix a setup violation and four for hold, with side-effects"]},
   {title:"Writing constraints (SDC)",hours:16,learn:"create_clock, create_generated_clock, set_input_delay/set_output_delay (with virtual clocks), set_clock_uncertainty, set_clock_latency, set_false_path, set_multicycle_path (setup/hold pairing), set_max_delay, set_case_analysis, set_disable_timing, clock groups, IO constraints for source-synchronous interfaces, constraint sanity (check_timing).",do:"Write the full SDC for your mini-SoC (two clocks + generated clock + UART async IO) and verify it with OpenSTA check_timing; write a Tcl script to report the 20 worst paths per clock group.",res:["bhasker","opensta","tcl-tutorial"],check:["I can write an SDC for a design with two clocks and a generated clock, including IO delays","I can explain the hold multi-cycle pairing rule and why people get it wrong"]},
   {title:"Timing closure ECOs",hours:10,learn:"Upsizing/downsizing, buffering, logic restructuring, register duplication, useful skew, pipelining vs retiming, hold-fixing with delay cells, when to push back on the constraint, how PD and RTL teams share closure work.",do:"Take a failing path in your core and close it two different ways (RTL and cell-level); write a one-page ECO note like you would send a PD engineer.",res:["bhasker","vlsiexpert"],check:["I closed a real timing violation in my own design and documented the trade-off"]}
  ]},
  {id:"V5",name:"Physical Design — RTL to GDSII",hours:120,goal:"Take your own RTL to a DRC/LVS-clean GDS on sky130 with OpenLane/OpenROAD and be able to explain every stage the way a PD engineer would.",modules:[
   {title:"The flow and the inputs",hours:14,learn:"PD flow overview, inputs (netlist, .lib, LEF/DEF, tech LEF, SDC, UPF), the PDK (design rules, standard-cell library, metal stack), utilisation, aspect ratio, what OpenLane/OpenROAD do at each stage and what Innovus/ICC2/Fusion Compiler add.",do:"Run the OpenLane 2 tutorial design end to end; open the results in KLayout/OpenROAD GUI; identify each stage's output files.",res:["openlane","openroad","teman","vlsicad2","sky130"],check:["I can name every input file of a PD flow and what it contains","I ran a full RTL→GDS flow and can locate the DEF/LEF/GDS/SPEF outputs"]},
   {title:"Floorplanning and power planning",hours:22,learn:"Die/core sizing, utilisation targets, IO placement, macro placement guidelines (flylines, channels, halos/keepouts, pin orientation), power rings and straps, power grid design, IR drop (static/dynamic), electromigration, decap cells, tap and end-cap cells, blockages, partitioning intuition.",do:"Floorplan your mini-SoC with a memory macro; iterate utilisation 40–70%; run IR-drop analysis (OpenROAD psm) and fix a hotspot with extra straps.",res:["kahng","teman","openroad","teamvlsi"],check:["I can explain how utilisation and aspect ratio affect routability and timing","I can describe a power grid and how IR drop is reduced","I placed a macro with proper halos and can justify the location"]},
   {title:"Placement and clock-tree synthesis",hours:24,learn:"Global vs detailed placement, timing-driven and congestion-driven placement, cell density, legalization, placement blockages, high-fanout net synthesis, CTS goals (skew, latency, transition), clock buffers vs inverters, NDR routing for clocks, clock gating in CTS, useful skew, H-tree vs mesh, post-CTS hold fixing.",do:"Compare timing-driven vs default placement on your core; run CTS and report skew/latency; add a clock-gating cell and observe CTS handling.",res:["kahng","teman","openroad","vlsiexpert"],check:["I can explain why CTS is done before routing and what post-CTS hold fixing is","I can read a CTS report (skew, insertion delay) and say what is bad"]},
   {title:"Routing, signoff and physical verification",hours:32,learn:"Global vs track vs detailed routing, DRC types (spacing, width, via, density), antenna violations and fixes (diodes, metal jumpers), crosstalk and shielding, SI-aware timing, parasitic extraction (RC, SPEF), post-route STA and ECO loops, DRC/LVS/ERC (Magic/KLayout/Netgen), metal fill, DFM, GDS streaming, tape-out checklist.",do:"Route your core, extract parasitics, run post-route STA with OpenSTA, fix any violations, run DRC/LVS in Magic + Netgen until clean, and stream out a GDS. Produce a PPA table (area, Fmax, power) for two utilisation settings.",res:["openlane","openroad","sky130","kahng","teamvlsi"],check:["My core is DRC/LVS clean on sky130 with a GDS in the repo","I can explain antenna violations and two fixes","I can explain SPEF and why post-route timing differs from pre-route"]},
   {title:"Low power in PD and the sign-off mindset",hours:18,learn:"Power domains, isolation and level shifters, retention, power switches, multi-Vt swapping, UPF concepts, leakage vs dynamic recovery techniques, sign-off criteria (timing, power, IR/EM, DRC/LVS, antenna, ERC), how a PD engineer's week actually looks (ECOs, reviews, corners).",do:"Write a UPF for a two-domain version of your SoC (conceptual) and a one-page sign-off checklist for your GDS.",res:["lowpower","kahng","vlsiexpert"],check:["I can explain the five low-power design techniques and where each is inserted","I have a sign-off checklist I could defend in an interview"]}
  ]},
  {id:"V6",name:"DFT + Low-power design",hours:50,goal:"Know scan, ATPG, MBIST and JTAG well enough to interview for DFT roles and to design DFT-friendly RTL in any role.",modules:[
   {title:"Testing fundamentals and scan",hours:18,learn:"Why test (yield, defects, DPPM), fault models (stuck-at, transition, path-delay, bridging, IDDQ), controllability/observability, scan flops and scan chains, scan insertion rules (reset, clocks, tristates), lock-up latches, shift vs capture, test coverage vs fault coverage, at-speed test (LOC/LOS).",do:"Convert your UART design to scan manually (mux-D flops), write a shift/capture testbench, compute stuck-at coverage with an open ATPG (e.g. the Fault tool from the OpenLane ecosystem, or a small Python ATPG you write).",res:["bushnell","nptel-testing","fault-dft"],check:["I can explain scan shift and capture with a timing diagram","I can list five RTL rules that make a design scan-friendly"]},
   {title:"ATPG, compression, BIST and JTAG",hours:18,learn:"D-algorithm/PODEM intuition, test-pattern count vs coverage, test compression (EDT/decompressor) and why it exists, LBIST, MBIST (algorithms like March C-, repair), boundary scan (IEEE 1149.1: TAP, IR/DR, BYPASS/EXTEST), IEEE 1500 wrappers, test-time cost and ATE basics.",do:"Implement a JTAG TAP controller with BYPASS and IDCODE; write a March C- MBIST controller for a small RAM and demonstrate a detected fault.",res:["bushnell","nptel-testing"],check:["I can draw the 16-state TAP controller from memory","I implemented an MBIST controller that detects an injected stuck-at fault"]},
   {title:"Low-power design (RTL-level)",hours:14,learn:"Clock gating (RTL enable vs ICG), operand isolation, bus encoding, memory banking and sleep modes, DVFS idea, power intent (UPF) as seen by RTL/DV, power-aware verification checks, power estimation flow (activity → power).",do:"Add clock gating to your core's pipeline stages and measure switching-activity power before/after with Yosys/OpenSTA power reports on a VCD.",res:["lowpower","weste"],check:["I measured a power delta from clock gating on my own design","I can explain UPF isolation/retention to a DV engineer"]}
  ]},
  {id:"V7",name:"FPGA prototyping & bring-up",hours:40,goal:"Prove every design on real hardware — interviewers trust a board video more than a slide.",modules:[
   {title:"FPGA flow",hours:20,learn:"Vivado (free WebPACK-class) or Gowin/Quartus flow, XDC constraints, IO standards, block RAM/DSP inference, timing closure on FPGA, ILA/logic-analyser debug, bitstream and configuration, differences FPGA vs ASIC (LUTs, no gate sizing, DSP48, global clock nets).",do:"Bring up your mini-SoC on a Tang Nano 9K / Basys 3 / Arty A7 (whichever you can afford; Tang Nano 9K ≈ ₹1.5–2k); record a 60-second video of it printing over UART.",res:["nandland","fpga4student","vivado"],check:["My SoC runs on an FPGA board and I have a video link on my portfolio","I can explain why my ASIC Fmax differs from FPGA Fmax"]},
   {title:"HW/SW co-design",hours:20,learn:"Memory-mapped registers from C, bare-metal startup code, linker scripts, interrupts, simple drivers, debugging with UART prints, a tiny bootloader.",do:"Write a bare-metal C program with a timer interrupt and a UART driver for your SoC.",res:["riscv-spec","picorv32"],check:["I wrote a linker script and startup code for my own core","I can explain what happens between reset and main() on my SoC"]}
  ]},
  {id:"V8",name:"Interview mastery + portfolio",hours:60,goal:"Turn the work into offers: a resume that survives a 6-second screen, a portfolio that survives a 10-minute click-through, and answers that survive a 60-minute panel.",modules:[
   {title:"Question bank drills (all lanes)",hours:30,learn:"Work through the full question bank in the Interviews tab lane by lane. For every question: write the answer, draw the diagram, then say it out loud in under two minutes.",do:"Record yourself answering 10 questions per day; fix the ones you fumble. Do two mock interviews per week with a peer or with the 'Study with Claude' mock-interview prompt.",res:["chipverify","vlsiexpert","vacademy"],check:["I can answer every 🔴 question in the bank without notes","I have done at least 10 recorded mock interviews"]},
   {title:"Resume, portfolio and GitHub",hours:14,learn:"One page. Lines 1–3 = strongest proof (tapeout, RISC-V core with compliance pass, UVM env with coverage %). Numbers on every bullet (Fmax, coverage %, cell count, tests, seeds). A portfolio page with a GDS screenshot, board video, coverage report, and links. README-first repos with architecture diagrams and a 'how to run' block.",do:"Ship the portfolio (GitHub Pages is enough). Have three engineers review the resume. Tailor a DV version and an RTL version.",res:["git-book"],check:["Resume is one page with a number in every bullet","Portfolio has GDS image, board video, coverage report and clean READMEs"]},
   {title:"Aptitude, C/Python and puzzles",hours:16,learn:"Most Indian online rounds include aptitude + C/Python basics + digital logic MCQs. Practice pointers, bit manipulation in C, recursion, and classic puzzles (bit counting, parity, gray code, clock-divider by 3, 1.5, odd division, detect sequence '1011', design a 4-bit counter with only NAND gates, etc.).",do:"30 C/bit-manipulation problems; 30 digital puzzles; two full-length timed mock tests.",res:["neetcode","chipverify"],check:["I can write a bit-reversal and a popcount in C without looking","I can design a divide-by-3 with 50% duty cycle on a whiteboard"]}
  ]}

 projects:[
  {id:"VP1",name:"IP Suite — UART + SPI + I2C with APB wrappers",tier:"Starter",lane:"RTL + DV",weeks:"3–4",why:"Every VLSI interviewer has verified one of these. It proves you can read a protocol spec, code an FSM-based IP, wrap it on a bus and test it.",build:["Read the protocol; write a 1-page spec with register map before coding","UART with configurable baud, parity, FIFOs; SPI master modes 0–3; I2C master with clock stretching","APB slave register block per IP; parameterised; lint-clean","Self-checking SV testbenches + cocotb tests; loopback on FPGA","README with block diagram, timing diagrams, test table"],deliver:["3 IPs, 3 testbenches, FPGA loopback video","Functional coverage report ≥ 90% for UART"],stretch:["Add DMA-friendly AXI-Stream ports","Formal check of the I2C start/stop sequencing"],check:["Spec + register map written","All three IPs lint-clean and simulated","FPGA loopback video published","Coverage report published"]},
  {id:"VP2",name:"Async FIFO + CDC laboratory (formally proven)",tier:"Starter",lane:"RTL + Formal",weeks:"2",why:"FIFO depth, Gray pointers and CDC are the single most common interview topic. A formally proven FIFO in your repo ends that conversation in your favour.",build:["Parameterised sync FIFO and async FIFO (Cummings architecture)","SymbiYosys properties: no overflow/underflow, data ordering, pointer Gray-ness","CDC lab: handshake, pulse sync, mux sync, with a deliberately broken version and its waveform","Write-up: how to size a FIFO for a burst mismatch (with worked numbers)"],deliver:["Repo with formal proofs passing in CI","One-page FIFO-depth cheat-sheet"],stretch:["Add ECC to the FIFO storage"],check:["Async FIFO formal proof passing","CDC structures demonstrated with a bug and a fix","Depth calculation write-up published"]},
  {id:"VP3",name:"AXI4-Lite / AXI4 interconnect + UVM VIP (flagship DV)",tier:"Flagship",lane:"DV",weeks:"6–8",why:"This is the project a DV hiring manager wants to see: a reusable UVM VIP with agents, sequences, scoreboard, RAL and coverage, on the bus every SoC uses.",build:["AXI4-Lite 1×N interconnect with address decode; upgrade to AXI4 with bursts and outstanding IDs","UVM master and slave agents (active/passive), sequence library (single, burst, back-to-back, error responses)","Protocol checker in SVA; scoreboard with out-of-order support; functional coverage on burst/size/ID/response","RAL model for the connected register blocks from VP1","Regression: 20 tests × 5 seeds, coverage merge, HTML report"],deliver:["UVM VIP repo with architecture diagram","Coverage report (functional + code) and vplan spreadsheet","cocotb mirror of the same tests running in CI with Verilator"],stretch:["Add AXI4 exclusive access and QoS coverage","Performance metrics (throughput/latency) in the scoreboard"],check:["Interconnect passes directed + random tests","UVM env with agents, sequences, scoreboard, RAL, coverage","SVA protocol checker bound and firing on injected violations","Regression + coverage report published","cocotb/CI mirror running"]},
  {id:"VP4",name:"RV32IM 5-stage pipelined RISC-V core (flagship RTL)",tier:"Flagship",lane:"RTL + Arch + DV",weeks:"8–10",why:"A core that passes the official RISC-V tests and RISCOF compliance, verified against Spike, is the strongest non-degree signal for RTL and architecture roles.",build:["RV32I first; add M (multiplier from V1); CSRs, machine-mode traps, timer interrupt","5-stage pipeline with forwarding, load-use stall, branch prediction (2-bit + BTB), precise exceptions","Verilator co-simulation against Spike (compare architectural state each retire)","Pass riscv-tests and RISCOF; run a C program (Dhrystone/CoreMark-lite)","cocotb + SV testbenches; lint-clean; synthesise to sky130 and report Fmax/area"],deliver:["Core repo with pipeline diagram, hazard table, compliance log, Fmax/area table","Blog-style write-up: 'What broke and how I found it'"],stretch:["Add a simple L1 I-cache/D-cache (VP5)","Compressed (C) extension or a 2-way superscalar experiment"],check:["RV32I passes riscv-tests","RISCOF compliance passes","Spike co-simulation in place","Runs a C benchmark on FPGA","Synthesised with Fmax/area published"]},
  {id:"VP5",name:"L1 cache + AXI memory subsystem",tier:"Advanced",lane:"RTL + Arch",weeks:"4–5",why:"Cache questions dominate architecture interviews; having built one lets you answer from experience, not from a textbook.",build:["Direct-mapped → 2/4-way set-associative with PLRU, write-back + write-allocate","AXI4 master for refills/write-backs with bursts","Python cache model for cross-checking; trace-driven miss-rate study","Integrate with VP4 and measure CPI change"],deliver:["Cache RTL + model + miss-rate plots","CPI before/after table"],stretch:["Non-blocking cache with MSHRs","Simple MESI between two cores"],check:["Cache passes random + trace tests against the Python model","Integrated with core; CPI measured"]},
  {id:"VP6",name:"RTL-to-GDSII of your core on sky130 (flagship PD)",tier:"Flagship",lane:"PD + STA",weeks:"5–6",why:"A DRC/LVS-clean GDS with a documented timing-closure story is what makes PD and STA interviewers take a non-M.Tech candidate seriously.",build:["OpenLane 2 flow on the RV32IM core + SRAM macro (OpenRAM or sky130 SRAM)","Floorplan iterations (utilisation, macro placement), power grid + IR-drop fix","SDC with two clocks; timing closure across corners with OpenSTA; document each ECO","DRC/LVS clean in Magic/Netgen; antenna fixes; GDS in repo","PPA report: area, Fmax, power for two configurations"],deliver:["GDS + screenshots per stage","Timing-closure diary (violations → fixes → results)","PPA table"],stretch:["Try IHP SG13G2 or GF180 PDK for a second technology","Clock-gated variant and power comparison"],check:["Full flow completes without manual hacks","Timing met at signoff corner with documented ECOs","DRC/LVS clean; GDS published","PPA table published"]},
  {id:"VP7",name:"Real silicon — Tiny Tapeout submission",tier:"Differentiator",lane:"All",weeks:"2 (+ fab wait)",why:"'I have taped out' is a sentence very few freshers can say. Tiny Tapeout puts your design on a real 130 nm shuttle for a few hundred euros/dollars. After Efabless closed in 2025 the shuttles moved to ChipFoundry (sky130) and IHP; check tinytapeout.com for the current run, price and deadline.",build:["Choose a tile-sized design: your UART, a tiny CPU, a PWM/LED controller, or a small accelerator","Follow the Tiny Tapeout template repo; pass the GitHub Actions GDS + precheck","Submit before the deadline; document the design in the required info.yaml/README","When silicon arrives: bring-up video, measurements, bug list"],deliver:["Accepted submission with public design page","Bring-up video after delivery"],stretch:["Analog tile (needs more study) or a second design on the next shuttle"],check:["Submission accepted on a shuttle","Design page + write-up published","Silicon bring-up documented (when delivered)"]},
  {id:"VP8",name:"INT8 systolic-array matrix accelerator (AI hardware)",tier:"Advanced",lane:"RTL + DV",weeks:"5–6",why:"AI-accelerator design is the fastest-growing hardware job family (Nvidia, Google TPU, AMD, startups). A working systolic array with a verified GEMM shows you can design for throughput, not just correctness.",build:["4×4 then 8×8 weight-stationary systolic array of INT8 MACs with INT32 accumulators","AXI-Stream input/output, double-buffered weight loading, simple tiling controller","Python (NumPy) golden model; cocotb randomised GEMM tests; SVA on stream handshakes","FPGA demo computing a small matrix multiply; report MACs/cycle and Fmax; synthesise to sky130"],deliver:["Accelerator repo with dataflow diagram and throughput table","Verification report"],stretch:["Add ReLU/requantisation; run a tiny MNIST layer","Compare against a non-systolic MAC array on PPA"],check:["8×8 array passes randomised GEMM vs NumPy","FPGA demo with measured throughput","Synthesised PPA published"]},
  {id:"VP9",name:"DFT + low-power variant of the core",tier:"Advanced",lane:"DFT + LP",weeks:"3–4",why:"Shows you understand the full production picture — a design that can be tested on an ATE and that does not waste power.",build:["Scan insertion on the core (mux-D), chain stitching, lock-up latches where needed","ATPG with an open tool; report stuck-at coverage; identify untestable logic and fix","JTAG TAP + MBIST for the cache SRAM","Clock gating per pipeline stage; measure power delta on a VCD-based flow"],deliver:["Coverage numbers before/after DFT fixes","Power table before/after gating"],stretch:["Test compression concept implementation"],check:["Scan-inserted core simulates in shift/capture","Fault coverage published","MBIST detects injected fault","Power delta published"]},
  {id:"VP10",name:"Formal verification suite",tier:"Advanced",lane:"DV / Formal",weeks:"2–3",why:"Formal skills are rare in freshers and increasingly requested by Nvidia, Intel, Arm, Qualcomm DV teams.",build:["SymbiYosys proofs for FIFO, arbiter fairness/starvation, AXI4-Lite handshake rules, and a core-level property (e.g. no PC change without valid instruction)","Cover properties to prove reachability; assume/guarantee decomposition","Write-up on bounded vs unbounded proofs and what k-induction needed"],deliver:["Repo with proofs in CI","Short article on formal for RTL engineers"],stretch:["riscv-formal on your core"],check:["At least 15 properties proved in CI","riscv-formal attempted on the core"]}

 toolAccess:["Interviewers care that you know what each tool does and can read its reports — the open tools teach exactly that; the commands differ, the concepts do not.","EDA Playground gives you commercial-simulator UVM support for free — use it for VP3.","Short-term IIT/NIT/IIIT continuing-education courses (e.g. NIT Rourkela's VLSI-CAD summer program, IIT Bombay and IISc workshops) give a few weeks of hands-on Synopsys/Cadence access for a few thousand rupees — a cheap, honest way to put 'Synopsys DC/PrimeTime, Cadence Innovus' on your resume.","Paid training institutes (Maven Silicon, ChipEdge, VLSI Guru, VLSI Expert, Sumedha, etc.) sell three things: tool access, a placement pipeline into services companies, and a certificate. The certificate itself is weak; the tool access and placement pipeline can be worth ₹1.5–4 L only if your self-study is not converting to interviews after ~6 months of applying. Verify placement claims with alumni on LinkedIn before paying.","Never claim a tool on your resume that you cannot demonstrate in a 5-minute conversation."],
 certs:[
  ["NPTEL/SWAYAM certified courses (IIT professors): Hardware Modeling using Verilog, VLSI Physical Design, CMOS Digital VLSI Design, Computer Architecture, Digital VLSI Testing","₹1,000–1,500 per proctored exam","High in India — Elite/Gold + top-5% rank is a known signal to Indian hiring managers and replaces 'IIT' on a resume line","Do 3–5, aim Elite + Gold; put rank on the resume"],
  ["RISC-V Foundational Associate (RVFA) — Linux Foundation","≈ $250 (check current)","Medium — vendor-neutral, recognised by RISC-V companies (InCore, Mindgrove, SiFive, Qualcomm, Nvidia teams); pairs with your core project","After V2"],
  ["Coursera VLSI CAD Part I & II (UIUC)","Coursera subscription","Medium — respected content; certificate itself modest","During V4–V5"],
  ["Tiny Tapeout accepted design (with public design page)","€/$100–300 per tile + devkit","Very high — it is not a certificate, it is proof; more valuable than any paid certificate","VP7"],
  ["VSD workshops (sky130 RTL2GDS, RISC-V, STA) certificates","₹1,000–10,000 per workshop","Medium in India — hands-on; well known to Indian startups and services firms","V4–V5"],
  ["Zero to ASIC course certificate","≈ $600–1,200 (check)","Medium — respected in the open-silicon community; includes a tapeout path","Optional, V5"],
  ["Siemens Verification Academy course completions","Free","Low as a credential, high as knowledge — mention 'completed VA UVM/SV/Coverage tracks' only in the skills section","V3"],
  ["Cadence digital badges / Synopsys training completions","Via institute or employer","Medium if you actually have them; not reachable as an individual at reasonable cost — do not chase","Only if available"],
  ["IIT/NIT/IIIT short-term CEP courses with Synopsys/Cadence labs","₹3,000–15,000","Medium–high — a certificate plus real tool hours","V4–V5"],
  ["Paid institute programs (DV or PD track) — Maven Silicon, ChipEdge, VLSI Guru, etc.","₹1.5–4 L","Certificate: low. Placement pipeline + tool access: medium–high for services-company entry. Decide only after 6 months of self-study + outreach","Contingency, month 9+"],
  ["GATE (EC/EE) score","₹1,800 exam","Optional — a strong score is a screening signal for some Indian companies, PSUs (ISRO, DRDO, BEL, SCL) and keeps the IIT M.Tech door open. Not required for product companies","Optional, only if it costs < 2 months"]
 ],
 timeline:[
  ["Month 0–2","V0 + V1 (foundations, RTL). Ship VP1 and VP2. Start the weekly LinkedIn build-log. Begin NPTEL Verilog course (exam in the next cycle)."],
  ["Month 3–5","V2 + V3 (architecture, DV). Ship VP3 (UVM VIP) and VP4 core to 'passes riscv-tests'. Take RVFA. Attend/volunteer at DVCon India if in season. Start outreach system at 50% cadence (learn the ropes)."],
  ["Month 6–8","V4 + V5 (STA, PD). Ship VP6 (GDS) and submit VP7 (Tiny Tapeout). Portfolio live. Start full outreach cadence; apply to internships/trainee roles + services companies + startups. First interviews expected here."],
  ["Month 9–11","V6/V7 + V8 (DFT, FPGA, interview drills). VP5/VP8 as time allows. Full application cadence; 2 mock interviews/week. If no interviews by month 9 despite the cadence, trigger the contingency (institute with placement pipeline) — not before."],
  ["Month 12–15","Offers. Take the best learning environment, not the best first number: a product-company DV/RTL role beats a higher-paying non-VLSI role; a services-company core-VLSI role beats a product-company non-core role."],
  ["Year 1–3 (in job)","Own a block end-to-end. Learn the commercial tools deeply. Become the person who fixes the regression at 2 a.m. Keep the portfolio alive (conference talk, open-source PR to OpenROAD/cocotb/Ibex). Move to a product company by year 3 at the latest (₹18–35 LPA band)."],
  ["Year 3–6","Choose the 1 Cr route: (a) Nvidia/Apple/Qualcomm/AMD/Micron/Google/Microsoft silicon in India — senior/staff track with RSUs; or (b) internal transfer or direct hire abroad (US L-1/H-1B via your MNC, Netherlands, Germany, Ireland, Singapore, Taiwan, Japan). Total comp crosses 1 Cr typically at year 6–9 in India for strong performers, and at year 4–6 abroad."]
 ],
 companies:[
  ["Product — global (India centres)","Nvidia, Qualcomm, Intel, AMD, Apple, Samsung (SSIR), Micron, Texas Instruments, Broadcom, Marvell, MediaTek, NXP, Infineon, STMicro, Renesas, Microchip, Analog Devices, Western Digital, Google (silicon), Microsoft (Azure hardware), Amazon (Annapurna), Tesla, Rivos, Tenstorrent, Arm, Imagination, Synopsys & Cadence & Siemens EDA (R&D + AE roles), Rapidus (Japan) hires in India too","Highest pay; fresher seats mostly via referrals and campus; off-campus 'early career' postings do exist — apply with referral"],
  ["Design services / IP (widest entry door)","Tessolve, eInfochips (Arrow), Sasken, HCLTech, Wipro, Capgemini Engineering, L&T Technology Services, Cyient, Tata Elxsi, Mirafra, MosChip, Ignitarium, Truechip, Sankalp (HCL), Vervesemi, Cognizant/TCS/Infosys silicon units, staffing partners (Quess, Experis, etc.) placing contractors at Intel/Qualcomm/Micron","Hire freshers and 'trainee' batches; pay ₹4–9 LPA; you learn commercial tools on client projects; leave for product in 2–3 years"],
  ["Indian startups (RISC-V, AI, comms)","InCore Semiconductors, Mindgrove, Netrasemi, Signalchip, Saankhya/Tejas Networks, Morphing Machines, Ola Krutrim silicon, C-DAC (govt), Tata Electronics (fab/OSAT; design roles growing)","Small teams, broad exposure, faster ownership; pay varies widely; excellent for a 'first proof' year"],
  ["Abroad — realistic geographies for Indian engineers","Netherlands (NXP, ASML, Nexperia), Germany (Infineon, Bosch, Apple Munich, Intel), Ireland (Analog Devices, Qualcomm, Intel), UK (Arm, Imagination, Graphcore), Belgium (imec), Sweden (Ericsson), Singapore (Micron, Marvell, AMD, MediaTek), Taiwan (MediaTek, TSMC — Mandarin helps), Japan (Rapidus, Renesas, Kioxia, Socionext — actively hiring foreigners), Malaysia (Intel, Micron), Canada (AMD, Synopsys, Microchip), UAE (new design centres), USA (via L-1 transfer from your MNC after 1+ year, H-1B lottery, or an MS)","Direct fresher hires from abroad are rare; the realistic route is 2–4 years at an MNC in India then an internal transfer, or a funded MS abroad (the highest-probability path to a US 1 Cr+ role if you ever want it)"]

 outreach:{
  weekly:[
   ["Mon","Apply to 5 roles (only with a referral or a tailored note) · Log all in the tracker"],
   ["Tue","Send 10 LinkedIn connection requests with a 2-line note to DV/RTL/PD engineers at target companies"],
   ["Wed","Message 5 recruiters (template A/B) · Post your weekly build-log (what you built, a screenshot, one lesson)"],
   ["Thu","Ask 3 people you've built rapport with for a referral (template D) · Follow up on last week's messages (template E)"],
   ["Fri","1 hour in communities (r/chipdesign, VSD/Tiny Tapeout Discord, RISC-V Slack) answering questions · 1 informational call if scheduled"],
   ["Sat","Mock interview (record it) · Update portfolio with the week's proof"],
   ["Sun","Review tracker: reply rates per template, adjust; plan next week's 5 companies"]
  ],
  find:["LinkedIn search: 'Technical Recruiter' OR 'Talent Acquisition' + company name + (silicon OR VLSI OR ASIC OR hardware). Recruiters who post openings are the ones to message.","Find hiring managers: search 'Design Verification Manager' / 'RTL Design Lead' / 'Physical Design Manager' + company + city; also the people who comment 'we are hiring' on posts.","Find referrers: alumni from your college at the company (LinkedIn alumni tool), people who reacted to your build-log posts, engineers who answered you in a community.","Every product company's careers site has 'early career' / 'university' filters — check them weekly; many freshers roles are never posted on LinkedIn.","Design-services companies run batch hiring — email the campus/trainee hiring IDs listed on their careers pages with your resume + portfolio link.","Conferences: DVCon India (Sept, Bengaluru), VLSID (Jan), RISC-V Summit, IEEE events — volunteer to get in free; collect 20 contacts; follow up within 48 hours.","Staffing partners of Intel/Qualcomm/Micron/Samsung hire contract engineers who later convert — a legitimate entry door; search 'contract' + 'DV engineer' + city."],
  rules:["Referral first: an application with a referral gets read; a cold application at a product company is a lottery ticket.","Every message leads with proof, not with a request. One line of who you are, one line of proof with a link, one specific ask.","Ask for a 15-minute conversation, not a job. Ask for feedback on your project, not for a referral — referrals follow good conversations.","Follow up exactly twice (day 4 and day 10), then stop. Never follow up without adding something new (a new result, a new post).","Track reply rates per template; rewrite anything under 15%.","Never send a generic 'I am looking for opportunities' message — it is deleted on sight.","Reply to every rejection with two lines of thanks and one question about what would make you a fit next time. About one in five answers, and those answers are gold."],
  templates:[
   {id:"vtA",label:"A · Recruiter — first message (LinkedIn DM, ≤ 80 words)",body:"Hi <Name>, I'm an EE graduate targeting Design Verification roles. In the last 8 months I built a UVM VIP for AXI4 (functional coverage 96%, 100-seed regression) and an RV32IM core that passes RISCOF compliance — everything is public here: <portfolio link>.\n\nI saw <Company> is hiring for <role/req ID>. Would you be open to a 10-minute call this week to see if my profile fits, or point me to the right hiring manager?\n\nThanks,\n<Your name>"},
   {id:"vtB",label:"B · Recruiter — no open req (short + proof)",body:"Hi <Name>, I follow <Company>'s <team/product> work closely. I'm a self-taught DV/RTL engineer (EE B.Tech) with a taped-out design on Tiny Tapeout and a RISC-V core verified against Spike: <portfolio link>.\n\nIf DV/RTL fresher or trainee openings come up in the next quarter, I'd be grateful to be on your list. Happy to share a one-page resume tailored to the team.\n\n<Your name>"},
   {id:"vtC",label:"C · Hiring manager / senior engineer — feedback ask (the one that gets referrals)",body:"Hi <Name>, I read your post on <topic> — the point about <specific detail> matched a bug I hit while building an AXI4 UVM environment. I'm an EE graduate moving into DV without an M.Tech, so I'm proving it with public work: <link to one repo>.\n\nCould I ask you one question: if you were screening my profile for a fresher DV role, what is the first gap you'd see? A 2-line reply would already help me a lot. Thank you for your time.\n\n<Your name>"},
   {id:"vtD",label:"D · Referral ask (only after a real conversation)",body:"Hi <Name>, thank you again for the feedback on my UVM environment last week — I added the out-of-order scoreboard you suggested and the coverage went from 88% to 96% (<link>).\n\nI noticed <Company> has an open <role> (<req ID>). If you feel comfortable, would you be willing to refer me? I've attached a one-page resume tailored to the req. If it's not a fit, no problem at all — I'm grateful for your time either way.\n\n<Your name>"},
   {id:"vtE",label:"E · Follow-up (day 4 / day 10) — always with something new",body:"Hi <Name>, quick follow-up on my note from <day>. Since then I closed timing on my RISC-V core at 100 MHz on sky130 and published the GDS: <link>. If a 10-minute call is possible this week, I'd appreciate it; if now isn't the right time, I'll check back in a few weeks.\n\n<Your name>"},
   {id:"vtF",label:"F · Cold email to a hiring manager / startup founder (subject line included)",body:"Subject: EE grad with taped-out design — DV/RTL fresher for <Team>\n\nHi <Name>,\n\nI'm writing directly because <Company>'s <specific product/RISC-V core/accelerator> is exactly what I've been building toward. Three things I can show today:\n1. RV32IM 5-stage core — passes riscv-tests + RISCOF, Spike co-sim (<link>)\n2. AXI4 UVM VIP — agents, RAL, 96% functional coverage, regression in CI (<link>)\n3. Tiny Tapeout submission on sky130 — <link>\n\nI don't have an M.Tech; I have the work. If you have a fresher/trainee DV or RTL opening — or would take 15 minutes to tell me what you'd need to see — I'd be grateful.\n\n<Your name> · <phone> · <portfolio>"},

   ["Physical design","S",["Full flow stages and outputs; inputs to PD","Floorplan: utilisation, aspect ratio, macro placement rules, halos, channels","Power planning: rings/straps, IR drop, EM, decaps, tap cells","Placement: timing vs congestion driven; legalization; density","CTS: goals, skew/latency, NDR, clock gating, H-tree vs mesh; why before routing","Routing: global/track/detail; DRC classes; antenna effect and fixes; crosstalk","Post-route STA; SPEF; SI; ECO loop","Signoff checklist; DRC/LVS/ERC; metal fill; DFM","Low power: multi-Vt, power gating, isolation, retention, level shifters, UPF"]],

function vlsiKeys(){const k=[];VLSI.phases.forEach(p=>p.modules.forEach((m,i)=>m.check.forEach((_,j)=>k.push(`vl:${p.id}:${i}:${j}`))));VLSI.projects.forEach(p=>p.check.forEach((_,j)=>k.push(`vl:${p.id}:${j}`)));return k}
function vlsiPct(){const k=vlsiKeys();return pct(k.filter(x=>S.checks[x]).length,k.length)}
function vlsiPhasePct(p){const k=[];p.modules.forEach((m,i)=>m.check.forEach((_,j)=>k.push(`vl:${p.id}:${i}:${j}`)));return pct(k.filter(x=>S.checks[x]).length,k.length)}
function vlsiLink(k){const r=VLSI.resources[k]||DATA.resources[k];if(!r)return '';return r.url?`<a href="${r.url}" target="_blank" rel="noopener">📚 ${esc(r.name)}</a>`:`📚 ${esc(r.name)}`}
function vVlsi(){const tab=sub.vtab||'start';const tabs=[['start','🧭 Start here'],['roadmap','🗺️ Roadmap'],['projects','🚀 Projects'],['resources','📚 Resources'],['tools','🧰 Tools'],['certs','🎓 Certifications'],['job','🎯 Job plan'],['outreach','📨 Outreach'],['interview','🎤 Interviews']];
 const total=vlsiPct();
 let body='';
 if(tab==='start'){body=`<div class="stats"><div class="stat"><div class="lab">Track progress</div><div class="val">${total}%</div>${bar(total,true)}</div><div class="stat"><div class="lab">Study hours</div><div class="val txt">${esc(VLSI.meta.hours)}</div><div class="tiny muted">≈ 8–9 months at 3–4 h/day</div></div><div class="stat"><div class="lab">Primary lane</div><div class="val txt">Design Verification</div><div class="tiny muted">+ RTL as secondary</div></div><div class="stat"><div class="lab">First applications</div><div class="val txt">Month 6–8</div><div class="tiny muted">after VP3 + VP4 + GDS</div></div></div>
 <div class="card"><h3>Read this first — the honest version</h3>${VLSI.reality.map(([h,t])=>`<h4>${esc(h)}</h4><p class="small">${esc(t)}</p>`).join('')}</div>
 <div class="card"><h3>Lanes — pick one primary</h3><table><tr><th>Lane</th><th>What you do</th><th>Hiring reality for a non-M.Tech EE</th><th>This track</th></tr>${VLSI.lanes.map(l=>`<tr>${l.map((c,i)=>`<td class="${i?'small':''}">${i===0?'<strong>'+esc(c)+'</strong>':esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>
 <div class="card"><h3>How to use this track</h3><p class="small">Go tab by tab: <strong>Roadmap</strong> (phases V0–V8, tick checks only when true without notes) → <strong>Projects</strong> (VP1–VP10, the proof) → <strong>Resources / Tools / Certifications</strong> (what to open, what to pay for, what to ignore) → <strong>Job plan</strong> (timeline, companies, geographies, salary ladder to 1 Cr) → <strong>Outreach</strong> (weekly cadence + copy-paste templates) → <strong>Interviews</strong> (question bank + mock prompt). Every module has a 🤖 button that opens the tutor with the topic pre-filled.</p><div class="ok">Progress here is stored under its own keys and never counts toward — or changes — the main 52-week roadmap.</div></div>`}
 else if(tab==='roadmap'){body=`<p class="lead small">Eight phases. Hours are honest estimates for focused study. Do phases in order; V3 (DV) is the one you must not skip even if you prefer RTL — every RTL fresher is interviewed as a DV engineer too.</p>${VLSI.phases.map((p,pi)=>{const pc=vlsiPhasePct(p);return `<details id="vl-${p.id}" ${pi===0?'open':''}><summary><span>${p.id} · ${esc(p.name)} <span class="muted small">· ${p.modules.length} modules · ~${p.hours} h</span></span><span class="muted small">${pc}%</span></summary><div class="body">${bar(pc,true)}<p class="small muted"><strong>Goal:</strong> ${esc(p.goal)}</p>${p.modules.map((m,i)=>{const done=m.check.every((_,j)=>S.checks[`vl:${p.id}:${i}:${j}`]);return `<details class="inner" id="vlm-${p.id}-${i}"><summary><span>${done?'✅':'◻'} ${i+1}. ${esc(m.title)} <span class="muted tiny">· ~${m.hours} h</span></span></summary><div class="body"><p class="small" style="margin-top:8px"><strong>Learn:</strong> ${esc(m.learn)}</p><p class="small"><strong>Do:</strong> ${esc(m.do)}</p><div class="small"><strong>Resources:</strong> ${m.res.map(k=>vlsiLink(k)).filter(Boolean).join(' · ')}</div><h4>Checks (tick when true without notes)</h4>${checks(`vl:${p.id}:${i}:`,m.check)}<div class="row" style="margin-top:8px"><button class="btn sm" data-sidetutor="${esc('VLSI · '+m.title)}">🤖 Study this with Claude</button></div></div></details>`}).join('')}</div></details>`}).join('')}`}
 else if(tab==='projects'){body=`<p class="lead small">Ten projects, in the order they build on each other. VP3, VP4 and VP6 are the flagships that go in the first three lines of your resume; VP7 (real silicon) is the differentiator. Each project should end with a README, numbers, and a screenshot or video.</p>${VLSI.projects.map((p,pi)=>{const d=p.check.filter((_,j)=>S.checks[`vl:${p.id}:${j}`]).length;const pc=pct(d,p.check.length);return `<details id="vl-${p.id}" ${pi===0?'open':''}><summary><span>${p.id} · ${esc(p.name)} <span class="badge">${esc(p.tier)}</span> <span class="muted small">· ${esc(p.lane)} · ${esc(p.weeks)} wk</span></span><span class="muted small">${pc}%</span></summary><div class="body">${bar(pc,true)}<p class="small"><strong>Why hiring managers care:</strong> ${esc(p.why)}</p><h4>Build</h4><ol class="small" style="margin:0 0 8px 18px;padding:0">${p.build.map(b=>`<li>${esc(b)}</li>`).join('')}</ol><h4>Deliverables</h4><ul class="small" style="margin:0 0 8px 18px;padding:0">${p.deliver.map(b=>`<li>${esc(b)}</li>`).join('')}</ul><h4>Stretch</h4><ul class="small" style="margin:0 0 8px 18px;padding:0">${p.stretch.map(b=>`<li>${esc(b)}</li>`).join('')}</ul><h4>Milestones</h4>${checks(`vl:${p.id}:`,p.check)}<div class="row" style="margin-top:8px"><button class="btn sm" data-sidetutor="${esc('VLSI project · '+p.name)}">🤖 Plan this with Claude</button></div></div></details>`}).join('')}`}
 else if(tab==='resources'){const q=(sub.vq||'').toLowerCase();const list=Object.entries(VLSI.resources).filter(([k,r])=>!q||(r.name+r.type+r.use+r.when).toLowerCase().includes(q));const groups={};list.forEach(([k,r])=>{(groups[r.type]=groups[r.type]||[]).push([k,r])});body=`<p class="lead small">Books are the spine (buy used or borrow; the Indian editions are cheap). Free courses and open tools cover everything else. Paid items are marked; buy only when a module asks for it.</p><input id="vq" placeholder="Filter VLSI resources…" value="${esc(sub.vq||'')}" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin-bottom:12px">${Object.entries(groups).map(([g,items])=>`<div class="card"><h3>${esc(g)}</h3><table><tr><th>Name</th><th>Use it for</th><th>Phase</th></tr>${items.map(([k,r])=>`<tr><td>${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${esc(r.name)}</a>`:esc(r.name)}</td><td class="small">${esc(r.use)}</td><td class="small">${esc(r.when)}</td></tr>`).join('')}</table></div>`).join('')}`}
 else if(tab==='tools'){body=`<p class="lead small">You will not have Synopsys/Cadence/Siemens licenses at home. That is fine: the concepts, the SDC, the reports and the flow are identical; the open tools below are used by real teams and in real tapeouts.</p><div class="card"><table><tr><th>Stage</th><th>Industry tools (know the names + what each does)</th><th>What you use at home</th></tr>${VLSI.tools.map(t=>`<tr>${t.map((c,i)=>`<td class="${i?'small':''}">${i===0?'<strong>'+esc(c)+'</strong>':esc(c)}</td>`).join('')}</tr>`).join('')}</table></div><div class="card"><h3>Getting commercial-tool exposure without a job</h3><ul class="small" style="margin:0 0 0 18px;padding:0">${VLSI.toolAccess.map(t=>`<li style="margin-bottom:6px">${esc(t)}</li>`).join('')}</ul></div>`}
 else if(tab==='certs'){body=`<p class="lead small">Ranked by what they actually do for a non-M.Tech resume in India and abroad. Proof (silicon, GitHub, coverage numbers) beats every certificate; certificates are the tie-breaker that gets a recruiter to open the proof.</p><div class="card"><table><tr><th>Certification / credential</th><th>Cost</th><th>Real value</th><th>When</th></tr>${VLSI.certs.map(c=>`<tr>${c.map((x,i)=>`<td class="${i?'small':''}">${i===0?'<strong>'+esc(x)+'</strong>':esc(x)}</td>`).join('')}</tr>`).join('')}</table></div><div class="warn">Skip anything that promises '100% placement' for a fee, any certificate you could obtain without doing hands-on work, and any course that does not end with a public artefact you can link to.</div>`}
 else if(tab==='job'){body=`<div class="card"><h3>Timeline — from today to 1 Cr</h3><table><tr><th>When</th><th>What happens</th></tr>${VLSI.timeline.map(t=>`<tr><td style="white-space:nowrap"><strong>${esc(t[0])}</strong></td><td class="small">${esc(t[1])}</td></tr>`).join('')}</table></div><div class="card"><h3>Where the jobs are</h3><table><tr><th>Door</th><th>Companies</th><th>Reality</th></tr>${VLSI.companies.map(c=>`<tr><td><strong>${esc(c[0])}</strong></td><td class="small">${esc(c[1])}</td><td class="small">${esc(c[2])}</td></tr>`).join('')}</table></div><div class="card"><h3>Salary ladder (planning numbers)</h3><table><tr><th>Stage</th><th>Range</th></tr>${VLSI.salary.map(s=>`<tr><td class="small">${esc(s[0])}</td><td class="small"><strong>${esc(s[1])}</strong></td></tr>`).join('')}</table></div><div class="card"><h3>Decision rules</h3><ul class="small" style="margin:0 0 0 18px;padding:0"><li style="margin-bottom:6px">Take the first core-VLSI offer that comes from a team where you will write RTL or testbenches daily, even at ₹5 LPA in a services firm — the second job is where the money starts, and it needs the first.</li><li style="margin-bottom:6px">Do not accept a 'VLSI' title that is actually documentation, tool support, or manual test — ask in the interview what you will commit to the repo in month 1.</li><li style="margin-bottom:6px">Contract roles at Intel/Qualcomm/Micron via staffing partners are a legitimate entry door and often convert; treat them like product-company roles.</li><li style="margin-bottom:6px">Abroad: start the paperwork conversation in year 2 at an MNC (internal mobility programs exist at Intel, Qualcomm, NXP, Infineon, Micron, AMD, Samsung). Learn the language basics of one target country (German, Japanese or Mandarin) during year 1–2 — it changes the odds.</li><li style="margin-bottom:6px">If, after 9 months of full cadence, you have zero interviews, change the door (institute pipeline / GATE-based PSU route / M.S. abroad application), not the goal.</li></ul></div>`}
 else if(tab==='outreach'){body=`<p class="lead small">The field is not small; it is closed. This system opens it. Run it weekly from month 3 (half cadence) and month 6 (full cadence). Track every message in a spreadsheet: date, person, company, template used, reply (Y/N), next step.</p><div class="card"><h3>Weekly cadence (≈ 5 h/week)</h3><table><tr><th>Day</th><th>Action</th></tr>${VLSI.outreach.weekly.map(w=>`<tr><td><strong>${esc(w[0])}</strong></td><td class="small">${esc(w[1])}</td></tr>`).join('')}</table></div><div class="card"><h3>How to find the right people</h3><ul class="small" style="margin:0 0 0 18px;padding:0">${VLSI.outreach.find.map(t=>`<li style="margin-bottom:6px">${esc(t)}</li>`).join('')}</ul></div><div class="card"><h3>Rules that decide reply rates</h3><ul class="small" style="margin:0 0 0 18px;padding:0">${VLSI.outreach.rules.map(t=>`<li style="margin-bottom:6px">${esc(t)}</li>`).join('')}</ul></div><h2>Templates (edit the &lt;placeholders&gt;, keep them short)</h2>${VLSI.outreach.templates.map(t=>`<div class="card tight"><div class="row between"><strong class="small">${esc(t.label)}</strong><button class="btn sm" data-copy="${t.id}">Copy prompt</button></div><textarea id="pt-${t.id}" style="width:100%;min-height:150px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit;font-size:.86rem;line-height:1.45">${esc(t.body)}</textarea></div>`).join('')}`}
 else if(tab==='interview'){body=`<div class="card"><h3>How the process runs</h3><ul class="small" style="margin:0 0 0 18px;padding:0">${VLSI.interview.process.map(t=>`<li style="margin-bottom:6px">${esc(t)}</li>`).join('')}</ul></div><p class="lead small">Question bank. 🔴 = must answer cold; 🟡 = should; 🟢 = nice. For each: write, draw, then say it aloud in under two minutes.</p>${VLSI.interview.bank.map((b,i)=>`<details id="vlq-${i}" ${i===0?'open':''}><summary><span><span class="pri ${b[1]}">${PRI[b[1]].slice(2)}</span> &nbsp;${esc(b[0])}</span><span class="muted small">${b[2].length} Qs</span></summary><div class="body"><ol class="small" style="margin:8px 0 0 18px;padding:0">${b[2].map(q=>`<li style="margin-bottom:5px">${esc(q)}</li>`).join('')}</ol><div class="row" style="margin-top:10px"><button class="btn sm" data-sidetutor="${esc('VLSI interview drill · '+b[0])}">🤖 Drill these with Claude</button></div></div></details>`).join('')}<div class="card"><h3>Mock-interview prompt</h3><p class="small">${esc(VLSI.interview.mock)}</p><div class="row"><button class="btn sm" data-sidetutor="VLSI mock interview · fresher Design Verification role">🤖 Start a mock interview with Claude</button></div></div>`}
 return `<h1>${VLSI.meta.emoji} ${esc(VLSI.meta.name)}</h1><p class="lead">${esc(VLSI.meta.intro)}</p><div class="tabs">${tabs.map(([k,v])=>`<button class="${tab===k?'on':''}" data-vtab="${k}">${v}</button>`).join('')}</div>${body}`}

const RENDER={side:vSide,tutor:vTutor,dashboard:vDashboard,today:vToday,week:vWeek,roadmap:vRoadmap,projects:vProjects,revision:vRevision,assess:vAssess,resources:vResources,progress:vProgress,final:vFinal,recovery:vRecovery,coverage:vCoverage,settings:vSettings,search:vSearch};
RENDER.blueprint=vBlueprint; RENDER.vlsi=vVlsi;
function render(){document.documentElement.setAttribute('data-theme',S.prefs.theme==='dark'?'dark':'light');const openIds=[...document.querySelectorAll('#content details[id][open]')].map(d=>d.id);document.getElementById('content').innerHTML=RENDER[view]();openIds.forEach(id=>{const d=document.getElementById(id);if(d)d.open=true});document.getElementById('crumb').textContent=(VIEWS.find(v=>v[0]===view)||['','','Search'])[2];const G=[['Daily',['dashboard','today','week','tutor']],['Plan',['blueprint','roadmap','projects','side','vlsi','resources']],['Track',['revision','assess','progress','final']],['Help',['recovery','coverage','settings']]];document.getElementById('nav').innerHTML=G.map(([g,ids])=>`<div class="grp">${g}</div>`+ids.map(id=>{const v=VIEWS.find(x=>x[0]===id);return `<button class="${view===v[0]?'active':''}" data-view="${v[0]}"><span class="ico">${v[1]}</span>${v[2]}</button>`}).join('')).join('');document.getElementById('mobnav').innerHTML=[['dashboard','🏠','Home'],['today','🎯','Today'],['week','📅','Week'],['tutor','🤖','Tutor'],['menu','☰','More']].map(v=>`<button class="${view===v[0]?'active':''}" data-view="${v[0]}"><span>${v[1]}</span>${v[2]}</button>`).join('');S.prefs.view=view;S.prefs.lastVisit=today();save();if(view!=='search')window.scrollTo({top:0});bindTimer();const p=document.getElementById(`proj-${sub.proj}`);if(view==='projects'&&p)p.scrollIntoView({block:'start'})}
function go(v,s){view=v;if(s)Object.assign(sub,s);render()}
// ---------------------------------------------------------------- events
document.addEventListener('click',e=>{const el=e.target.closest('[data-view],[data-task],[data-tutor],[data-sidetutor],[data-copy],[data-check],[data-week],[data-goweek],[data-goday-idx],[data-autoday],[data-wtab],[data-wday],[data-rtab],[data-typef],[data-mustonly],[data-dep],[data-sf],[data-search],[data-phase],[data-aphase],[data-proj]');if(!el)return;
 if(el.dataset.task!==undefined){toggleTask(el.dataset.task,el.checked);return}
 if(el.dataset.sidetutor){sub.tutorTask=null;sub.tutorTopic=el.dataset.sidetutor;go('tutor',{prompt:'tutor'});return}
 if(el.dataset.tutor){e.preventDefault();sub.tutorTask=el.dataset.tutor;sub.tutorTopic=null;go('tutor',{prompt:TBYID[el.dataset.tutor].type==='dsa'?'dsa':'tutor'});return}
 if(el.dataset.copy){const ta=document.getElementById('pt-'+el.dataset.copy);const txt=ta.value;const done=()=>{el.textContent='Copied ✓';setTimeout(()=>el.textContent='Copy prompt',1500)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>{ta.select();document.execCommand('copy');done()})}else{ta.select();document.execCommand('copy');done()}return}
 if(el.dataset.check!==undefined){setCheck(el.dataset.check,el.checked);return}
 if(el.tagName==='A'||el.tagName==='BUTTON'||el.classList.contains('chip')||el.classList.contains('node')||el.classList.contains('item')||el.dataset.week)e.preventDefault();
 if(el.dataset.view==='menu'){document.getElementById('side').classList.toggle('open');document.getElementById('dim').classList.toggle('on');return}
 if(el.dataset.search!==undefined){document.getElementById('search').value=el.dataset.search;go('search',{q:el.dataset.search});return}
 if(el.dataset.goweek){go('week',{week:+el.dataset.goweek,wday:+el.dataset.goday||1,wtab:'days'});return}
 if(el.dataset.week!==undefined){go('week',{week:+el.dataset.week,wtab:'days',wday:1});return}
 if(el.dataset.godayIdx!==undefined){const i=+el.dataset.godayIdx;S.prefs.dayPtr=Math.max(0,Math.min(DAYS.length-1,i));save();go('today');return}
 if(el.dataset.autoday){delete S.prefs.dayPtr;save();go('today');return}
 if(el.dataset.wtab){go('week',{wtab:el.dataset.wtab});return}
 if(el.dataset.wday){go('week',{wday:+el.dataset.wday});return}
 if(el.dataset.rtab){go('roadmap',{rtab:el.dataset.rtab});return}
 if(el.dataset.typef){S.prefs.typeFilter=el.dataset.typef;save();render();return}
 if(el.dataset.mustonly){S.prefs.mustOnly=!S.prefs.mustOnly;save();render();return}
 if(el.dataset.dep){sub.dep=sub.dep===el.dataset.dep?null:el.dataset.dep;render();return}
 if(el.dataset.sf){go('search',{sf:el.dataset.sf});return}
 if(el.dataset.phase){go('roadmap',{rtab:'explorer',phase:el.dataset.phase});return}
 if(el.dataset.aphase){go('assess',{aphase:el.dataset.aphase});return}
 if(el.dataset.proj){go('projects',{proj:el.dataset.proj});return}
 if(el.dataset.view){document.getElementById('side').classList.remove('open');document.getElementById('dim').classList.remove('on');go(el.dataset.view);return}
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.note){const [n,f]=el.dataset.note.split(':');if(f){S.notes[n]=S.notes[n]||{};S.notes[n][f]=el.value}else S.notes[el.dataset.note]=el.value;save()}
 if(el.id==='rq'){sub.rq=el.value;const q=el.value;render();const i=document.getElementById('rq');i.focus();i.setSelectionRange(q.length,q.length)}
 if(el.id==='search'){sub.q=el.value;if(view!=='search'&&el.value.trim())view='search';if(view==='search')render()}
 if(el.id==='startDate'){S.prefs.start=el.value;save()}
 if(el.id==='tutorTopic'){sub.tutorTopic=el.value;const c=tutorCtx();PROMPTS.forEach(pr=>{const ta=document.getElementById('pt-'+pr.id);if(ta)ta.value=fillPrompt(pr.body,c)})}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='themeSel'){S.prefs.theme=el.value;save();render()}if(el.id==='mustOnlyCb'){S.prefs.mustOnly=el.checked;save();render()}if(el.id==='tTask'){S.prefs.timerTask=el.value;save()}
 if(el.id==='importFile'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.done)throw 0;S=Object.assign(load(),s);save();render();alert('Progress imported.')}catch(x){alert('That file is not a Learning OS backup.')}};r.readAsText(el.files[0])}
 if(el.id==='exportBtn'){}});
document.addEventListener('click',e=>{if(e.target.id==='exportBtn'){const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(S));a.download=`learning-os-backup-${today()}.json`;a.click()}if(e.target.id==='resetBtn'){if(confirm('Reset ALL progress, notes and settings? Export a backup first.')){localStorage.removeItem(KEY);S=load();render()}}if(e.target.id==='themeBtn'){S.prefs.theme=S.prefs.theme==='dark'?'light':'dark';save();render()}if(e.target.id==='menuBtn'){document.getElementById('side').classList.toggle('open');document.getElementById('dim').classList.toggle('on')}if(e.target.id==='dim'){document.getElementById('side').classList.remove('open');document.getElementById('dim').classList.remove('on')}if(e.target.id==='wbClose'){document.getElementById('modal').innerHTML=''}if(e.target.id==='wbRecovery'){document.getElementById('modal').innerHTML='';go('recovery')}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();document.getElementById('search').focus()}if(e.key==='Escape'){document.getElementById('modal').innerHTML=''}});
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){sub.q=e.target.value;go('search')}});
// ---------------------------------------------------------------- timer
let tm={running:false,start:0,acc:0,lastTick:0,int:null};
function tFmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tUpdate(){const c=document.getElementById('clock');if(c)c.textContent=tFmt(tm.acc+(tm.running?Date.now()-tm.start:0))}
function tLog(){const now=Date.now();const el=tm.running?now-tm.lastTick:0;if(el>=60000){const m=Math.floor(el/60000);S.timer.byDate[today()]=(S.timer.byDate[today()]||0)+m;if(S.prefs.timerTask)S.timer.byTask[S.prefs.timerTask]=(S.timer.byTask[S.prefs.timerTask]||0)+m;tm.lastTick+=m*60000;save()}}
function bindTimer(){const s=document.getElementById('tStart');if(!s)return;s.onclick=()=>{if(tm.running)return;tm.running=true;tm.start=Date.now();tm.lastTick=Date.now();tm.int=setInterval(()=>{tUpdate();tLog()},1000)};document.getElementById('tPause').onclick=()=>{if(!tm.running)return;tLog();tm.acc+=Date.now()-tm.start;tm.running=false;clearInterval(tm.int);tUpdate();render()};document.getElementById('tReset').onclick=()=>{if(tm.running){tLog()}tm={running:false,start:0,acc:0,lastTick:0,int:null};tUpdate()};tUpdate()}
// ---------------------------------------------------------------- welcome back
(function(){const last=S.prefs.lastVisit;const any=Object.keys(S.done).length;if(last&&any){const gap=Math.round((new Date(today())-new Date(last))/864e5);if(gap>=2){const D=DAYS[curDayIdx()];const nt=nextTask();const o=progressOf(TASKS);document.getElementById('modal').innerHTML=`<div class="modal"><div class="card"><h2>Welcome back</h2><p class="muted">Last active ${gap} days ago. You were working on:</p><p><strong>${esc(PH[D.w.phase].name)}</strong> · Week ${D.w.n} · Day ${D.abs}<br><span class="muted">Completed: ${o.pct}%</span></p><p><strong>Recommended next step</strong><br>☐ ${nt?esc(nt.t):'Everything is done'}</p><div class="row"><button class="btn primary" id="wbClose">Continue</button>${gap>=3?`<button class="btn" id="wbRecovery">Open Recovery Mode</button>`:''}</div></div></div>`}}})();
if(!S.prefs.theme&&matchMedia('(prefers-color-scheme: dark)').matches)S.prefs.theme='dark';
render();
</script>
</body>
